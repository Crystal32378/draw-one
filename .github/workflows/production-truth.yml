name: production-truth

on:
  push:
    branches: [main]
  pull_request:

jobs:
  truth-layer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run production truth-layer regression suite
        run: node scripts/test-draw-pool.mjs

      - name: Committed draw pool must match a rebuild from corpus sources
        run: |
          node scripts/build-draw-pool.mjs
          git diff --exit-code -- assets/oracles.draw-pool.js data/production/draw-pool.report.json

      - name: Run 解曰 layer regression suite (three halls, holds, fail-closed counter-examples)
        run: node scripts/test-interpretation-pool.mjs

      - name: Committed 解曰 pools + holds must match a rebuild from corpus sources
        run: |
          node scripts/build-interpretation-pool.mjs
          git diff --exit-code -- assets/interpretation-pool.guanyin.js assets/interpretation-pool.guandi.js assets/interpretation-holds.js data/production/interpretation-pool.report.json data/production/interpretation-pool.guandi.report.json

      - name: Arrival mechanics contracts (incl. 紙落定即入簿)
        run: node scripts/test-arrival.mjs
