<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>抽一 Draw One — 埕</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400..700&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/slip.css?v=3" />
<style>
  /* ------------------------------------------------------------------
     The Arrival — 埕與沿革 prototype (V2B)
     基本單位是埕，不是殿。中軸留空：畫面正中央自上而下不放任何東西。
     第一人稱直式構圖：下＝你（案、籤簿），中＝空的埕，上緣兩側＝諸殿。
     牌匾只有聖號——能比較的才是 provider card，一個名字加一個方向不是。
     空間公共（對誰都一樣），記憶私人（只在你的籤簿與案上）。
     ------------------------------------------------------------------ */
  :root {
    --ground: #d9d2c0;        /* 埕的地 */
    --ground-far: #c7bfab;    /* 埕的遠處（簷影） */
    --paper: #f5efe2;
    --ink: #262119;
    --ink-soft: #6f6757;
    --cinnabar: #a63a2b;
    --rule: #4a4234;
    --qing: #4f6478; /* 佛頭青（褪過的礦物青）：本輪彩繪/線稿唯一冷色 */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: "Noto Sans TC", ui-sans-serif, system-ui, sans-serif;
    overflow: hidden;
  }
  .app { position: relative; max-width: 430px; height: 100dvh; margin: 0 auto; overflow: hidden; }
  .screen {
    position: absolute; inset: 0;
    display: none; flex-direction: column;
    transition: transform 520ms cubic-bezier(0.3, 0.7, 0.2, 1), opacity 520ms ease;
  }
  .screen.on { display: flex; }
  @media (prefers-reduced-motion: reduce) { .screen { transition: none; } }

  /* ============ 山門（初訪一次） ============
     底紋＝門檻感：王保原手稿式線描（角上插角草、中央曲團），
     佛頭青單色、opacity ≤ .12——是「入廟前」，不是空白 landing。 */
  #s-gate {
    background:
      url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 160 160'><g fill='none' stroke='%234f6478' stroke-width='1.6' opacity='.12' stroke-linecap='round'><path d='M4 4 Q64 10 96 34 Q124 55 118 86 Q114 108 92 108 Q76 108 74 92 Q73 80 84 78'/><path d='M4 22 Q48 28 74 46 Q96 62 92 84'/><path d='M10 4 Q20 40 44 58'/><path d='M118 86 Q130 98 148 100'/></g></svg>") 14px 14px / 150px 150px no-repeat,
      url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 160 160'><g fill='none' stroke='%234f6478' stroke-width='1.6' opacity='.12' stroke-linecap='round' transform='rotate(180 80 80)'><path d='M4 4 Q64 10 96 34 Q124 55 118 86 Q114 108 92 108 Q76 108 74 92 Q73 80 84 78'/><path d='M4 22 Q48 28 74 46 Q96 62 92 84'/><path d='M10 4 Q20 40 44 58'/><path d='M118 86 Q130 98 148 100'/></g></svg>") calc(100% - 14px) calc(100% - 14px) / 150px 150px no-repeat,
      url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 110'><g stroke='%234f6478' fill='none' stroke-width='1.5' opacity='.11' stroke-linecap='round'><circle cx='150' cy='46' r='7'/><path d='M146 40 l-3 -6 M154 40 l3 -6'/><path d='M143 44 C128 30 104 32 94 46 C88 56 93 66 103 66 C110 66 112 59 107 56'/><path d='M94 46 C82 40 70 45 68 56 Q67 62 72 64'/><path d='M157 44 C172 30 196 32 206 46 C212 56 207 66 197 66 C190 66 188 59 193 56'/><path d='M206 46 C218 40 230 45 232 56 Q233 62 228 64'/><path d='M64 60 Q46 54 36 64 Q30 71 36 77 Q41 81 45 76 Q47 72 43 70'/><path d='M236 60 Q254 54 264 64 Q270 71 264 77 Q259 81 255 76 Q253 72 257 70'/><path d='M28 56 h-18 v18 h12 v-11 h-7'/><path d='M272 56 h18 v18 h-12 v-11 h7'/><path d='M150 55 q-1 8 -7 12 M150 55 q1 8 7 12'/></g></svg>") center 11% / 300px 110px no-repeat,
      url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><g fill='none' stroke='%234f6478' stroke-width='1.4' opacity='.09' stroke-linecap='round'><circle cx='100' cy='100' r='56'/><circle cx='100' cy='100' r='60'/><path d='M100 56 L144 100 L100 144 L56 100 Z'/><path d='M100 64 L136 100 L100 136 L64 100 Z' opacity='.7'/><path d='M100 58 Q130 62 134 92 Q136 112 118 116 Q104 119 100 106 Q97 96 108 94'/><path d='M100 58 Q130 62 134 92 Q136 112 118 116 Q104 119 100 106 Q97 96 108 94' transform='rotate(90 100 100)'/><path d='M100 58 Q130 62 134 92 Q136 112 118 116 Q104 119 100 106 Q97 96 108 94' transform='rotate(180 100 100)'/><path d='M100 58 Q130 62 134 92 Q136 112 118 116 Q104 119 100 106 Q97 96 108 94' transform='rotate(270 100 100)'/></g></svg>") center 44% / 280px 280px no-repeat,
      var(--ground);
    align-items: center; justify-content: center;
    padding: 0 34px;
  }
  .gate-rules {
    border-top: 1px solid rgba(74, 66, 52, 0.5);
    border-bottom: 1px solid rgba(74, 66, 52, 0.5);
    padding: 30px 6px;
    display: grid; gap: 20px;
  }
  .gate-rules p {
    font-family: "Noto Serif TC", serif; font-weight: 500;
    font-size: 16px; letter-spacing: 0.24em; line-height: 1.7;
  }
  /* 門檻上的日期節氣（回訪薄門檻的定位；與 void 刻字同一語言） */
  .gate-date {
    margin-bottom: 30px; text-align: center;
    font-family: "Noto Serif TC", serif; font-weight: 500;
    font-size: 13px; letter-spacing: 0.32em; text-indent: 0.32em;
    color: rgba(64, 57, 44, 0.75);
  }
  /* 天氣票：四個字，無 icon、無說明——怎麼理解是使用者的事。
     選定＝一息安靜的落定；再點一次＝放回；不拿＝常日。 */
  .gate-weather { margin-top: 42px; display: grid; gap: 16px; justify-items: center; }
  .gw-label { font-size: 11.5px; letter-spacing: 0.3em; text-indent: 0.3em; color: var(--ink-soft); }
  .gw-opts { display: flex; gap: 28px; }
  .gw-opt {
    background: none; border: 0; border-bottom: 1px solid transparent;
    font: inherit; font-family: "Noto Serif TC", serif; font-weight: 500;
    font-size: 19px; color: var(--ink-soft); cursor: pointer;
    padding: 2px 5px 7px;
    transition: color 400ms ease, border-color 400ms ease, opacity 400ms ease;
  }
  .gw-opt.on { color: var(--ink); border-bottom-color: rgba(74, 66, 52, 0.6); }
  .gate-weather.chosen .gw-opt:not(.on) { opacity: 0.4; }
  .gate-enter {
    margin-top: 44px;
    background: none; border: 1px solid var(--rule);
    font: inherit; font-family: "Noto Serif TC", serif;
    font-size: 16px; letter-spacing: 0.5em; text-indent: 0.5em;
    padding: 13px 30px 13px 34px; color: var(--ink); cursor: pointer;
  }

  /* ============ 埕（v3：牆、量體、落地） ============
     你站在埕裡：水平拖動＝轉身。geometry：地平線 54%，連續遠側牆 24%–54%
     跑滿整條站列（殿長在牆上，不浮空）；殿＝凸出牆面的量體（簷＋側影＋
     門洞＋台階落地）；柱在站與站之間、1.55x 近景速，正對時在畫框外。
     左右交替擴建＝Draw One 自己的 geometry hypothesis（非文化依據）。 */
  #s-court { background: var(--ground); }
  .court-view {
    position: relative; flex: 1; overflow: hidden;
    touch-action: pan-y; cursor: grab;
    user-select: none; -webkit-user-select: none; /* 拖曳轉身不是選字 */
  }
  .court-view:active { cursor: grabbing; }
  .layer { position: absolute; inset: 0; pointer-events: none; }

  /* 遠景（0.35x）：天光與遠簷影 */
  .far-strip { position: absolute; inset: 0; will-change: transform; }
  .far-sky {
    position: absolute; left: -200%; right: -200%; top: 0; height: 26%;
    background: linear-gradient(180deg, #e3ddcd 0%, #ddd6c4 70%, #d7d0bd 100%);
  }
  .far-eaveshadow {
    position: absolute; left: -200%; right: -200%; top: 0; height: 9%;
    background: linear-gradient(180deg, rgba(52, 45, 34, 0.30), transparent);
  }

  /* 中景（1x）：連續遠側牆＋殿量體 */
  .stage-strip {
    position: absolute; left: 0; top: 0; height: 100%; display: flex; align-items: stretch;
    will-change: transform;
  }
  /* 牆：跑滿整條站列，殿長在牆上 */
  .stage-strip::before {
    content: ""; position: absolute; left: -60%; right: -60%;
    top: 24%; height: 30%;
    background:
      /* 牆頭瓦壓頂：牆是砌出來的，不是一條色帶 */
      linear-gradient(180deg, #b3ab97 0 2px, rgba(74, 66, 52, 0.30) 2px 3px, transparent 3px) top / 100% 6px no-repeat,
      repeating-linear-gradient(90deg, rgba(74, 66, 52, 0.13) 0 2px, transparent 2px 13px) top / 100% 4px no-repeat,
      /* 歲月斑與壁腳返潮 */
      radial-gradient(340px 90px at 30% 104%, rgba(74, 66, 52, 0.07), transparent 70%),
      radial-gradient(520px 130px at 68% -10%, rgba(245, 239, 226, 0.10), transparent 72%),
      radial-gradient(240px 70px at 84% 102%, rgba(74, 66, 52, 0.05), transparent 70%),
      linear-gradient(0deg, rgba(74, 66, 52, 0.10), transparent 14%),
      linear-gradient(180deg, #cfc8b4 0%, #cac2ad 78%, #c2baa4 100%);
    border-top: 1px solid rgba(74, 66, 52, 0.28);
    box-shadow: inset 0 -14px 18px -14px rgba(52, 45, 34, 0.35);
  }
  /* 牆腳線＝地平線 */
  .stage-strip::after {
    content: ""; position: absolute; left: -60%; right: -60%;
    top: 54%; height: 1px;
    background: rgba(74, 66, 52, 0.4);
  }
  .station {
    position: relative; flex: 0 0 auto; height: 100%;
    transform-origin: 50% 44%;
    will-change: transform, opacity;
  }

  /* 殿＝凸出牆面的量體 */
  .facade { position: absolute; inset: 0; cursor: pointer; pointer-events: auto; }
  /* 凸出的殿身：比牆亮半階、左右各一道側影＝進深；落在台基上 */
  .facade .body {
    position: absolute; left: 13%; right: 13%; top: 21.5%; bottom: 49.8%;
    background: linear-gradient(180deg, #d6cfba 0%, #d1c9b3 100%);
    border-left: 1px solid rgba(74, 66, 52, 0.30);
    border-right: 1px solid rgba(38, 33, 25, 0.42);
    box-shadow:
      inset -6px 0 8px -6px rgba(38, 33, 25, 0.4),
      inset 6px 0 8px -6px rgba(245, 239, 226, 0.5);
  }
  /* 步口退縮：明間整面退後半步，簷下才有深度可言 */
  .facade .recess {
    position: absolute; left: 27.4%; right: 27.4%; top: 21.5%; bottom: 50%;
    background: rgba(38, 33, 25, 0.075);
    box-shadow:
      inset 0 14px 16px -10px rgba(38, 33, 25, 0.42),
      inset 10px 0 12px -9px rgba(38, 33, 25, 0.32),
      inset -10px 0 12px -9px rgba(38, 33, 25, 0.32);
  }
  /* 水車堵：簷下堵帶上一道極淡的曲團草連續紋（礦物青線稿，手稿轉印感） */
  .facade .frieze {
    position: absolute; left: 13.6%; right: 13.6%; top: 22.8%; height: 2%;
    background:
      url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='28' height='10' viewBox='0 0 28 10'><g stroke='%234f6478' stroke-width='1' fill='none' opacity='.45' stroke-linecap='round'><path d='M2 8 Q2 2 8 2 Q13 2 13 6 Q13 9 10 9 Q8 9 8 7'/><path d='M13 5 Q19 1 26 4'/></g></svg>") center / 28px 10px repeat-x,
      rgba(245, 239, 226, 0.16);
    border-top: 1px solid rgba(74, 66, 52, 0.28);
    border-bottom: 1px solid rgba(74, 66, 52, 0.28);
  }
  /* 堵面：框飾型彩繪——佛頭青雙線框，中央留白（框在，題材不上） */
  .facade .panel {
    position: absolute; top: 30%; bottom: 52.5%;
    border: 1px solid rgba(74, 66, 52, 0.22);
    background: rgba(38, 33, 25, 0.03);
  }
  .facade .panel::before {
    content: ""; position: absolute; inset: 2px;
    border: 1px solid rgba(79, 100, 120, 0.42);
  }
  .facade .panel::after {
    content: ""; position: absolute; inset: 5px;
    border: 1px solid rgba(79, 100, 120, 0.20);
  }
  .facade .panel-l { left: 16.9%; width: 6.5%; }
  .facade .panel-r { right: 16.9%; width: 6.5%; }
  /* 簷柱與角柱：三開間；柱撐簷，屋頂不再浮空。柱腳有礎 */
  .facade .col {
    position: absolute; top: 20%; bottom: 50%; width: 3.2%;
    background:
      linear-gradient(180deg, transparent 68%, rgba(38, 33, 25, 0.12) 100%),
      linear-gradient(90deg, #b6ad96 0%, #a49b81 50%, #8b8269 100%);
    border-left: 1px solid rgba(245, 239, 226, 0.35);
    border-right: 1px solid rgba(38, 33, 25, 0.4);
  }
  .facade .col::after {
    content: ""; position: absolute; left: -22%; right: -22%; bottom: 0; height: 6.5%;
    background: #c6bea9;
    border: 1px solid rgba(74, 66, 52, 0.35);
  }
  .facade .col-ol { left: 12.3%; }
  .facade .col-or { right: 12.3%; }
  .facade .col-il { left: 24.6%; }
  .facade .col-ir { right: 24.6%; }
  /* 插角／雀替層：柱樑交接處的草仔曲線（木色骨＋青線彩飾，同一 motif 重複） */
  .facade .carve { position: absolute; left: 12%; right: 12%; top: 20.2%; height: 8.5%; }
  .facade .carve svg { display: block; width: 100%; height: 100%; }
  /* 石獅一對：守門石雕的重量（≈0.85m 含座，以殿門 2.4m 為 world scale）。
     bottom 錨定＝任何視窗高度都貼地；DOM 在柱之後＝頭臉永不被柱遮。 */
  .facade .lion {
    position: absolute; bottom: 44.6%; width: 34px; height: 50px;
  }
  .facade .lion svg { display: block; width: 100%; height: 100%; }
  .facade .lion-l { left: 19.5%; }
  .facade .lion-r { right: 19.5%; transform: scaleX(-1); }
  /* 供奉軸：門內的神龕／案桌一瞥——被感知，不被展示 */
  .facade .altar {
    position: absolute; left: 31.5%; right: 31.5%; top: 28%; bottom: 50%;
    overflow: hidden;
  }
  .facade .altar svg { display: block; width: 100%; height: 100%; }
  @keyframes candle { 0%, 100% { opacity: 0.75; } 46% { opacity: 1; } 58% { opacity: 0.85; } }
  .facade .altar .flames { animation: candle 5s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .facade .altar .flames { animation: none; } }
  /* 燈籠列：廟埕頭頂的場域訊號——小、疏、低垂度，不壓中軸 */
  .lived.lantern-rope { top: 4.6%; height: 1px; background: rgba(74, 66, 52, 0.30); }
  .lived.lantern {
    top: 5%; width: 15px; height: 18px;
    background: radial-gradient(60% 52% at 50% 40%, #b25a48, #92473b 82%);
    border-radius: 46% 46% 42% 42% / 56% 56% 44% 44%;
    border-top: 2px solid rgba(74, 66, 52, 0.55);
    box-shadow: inset 0 -2px 2px rgba(38, 33, 25, 0.25);
  }
  .lived.lantern::before { /* 吊繩 */
    content: ""; position: absolute; top: -6px; left: 50%; width: 1px; height: 6px;
    background: rgba(74, 66, 52, 0.5);
  }
  .lived.lantern::after { /* 纓 */
    content: ""; position: absolute; bottom: -4px; left: 50%; margin-left: -0.5px;
    width: 1px; height: 4px; background: rgba(140, 60, 45, 0.6);
  }
  /* 台基：殿抬離埕面，階沿見光 */
  .facade .podium {
    position: absolute; left: 11%; right: 11%; top: 50%; height: 4.3%;
    background: linear-gradient(180deg, #d2cab5 0%, #c3bba5 30%, #b4ac96 100%);
    border-top: 1px solid rgba(245, 239, 226, 0.55);
    border-bottom: 1px solid rgba(74, 66, 52, 0.35);
    box-shadow:
      inset 10px 0 10px -9px rgba(38, 33, 25, 0.3),
      inset -10px 0 10px -9px rgba(38, 33, 25, 0.3);
  }
  /* 屋頂（Move 1 roof silhouette）：屋面量體＋曲線正脊＋燕尾收勢＋出簷。
     SVG 三殿共用同一模板（equality）；出簷寬於殿身，脊探出牆頂（24%）之上，
     void 時鄰殿屋脊自然入畫。曲率/斜度為 Draw One 自己的 roof grammar
     （漢式宮廟語彙；證據參考王保原營造圖，非任一特定廟的尺寸規格）。 */
  .facade .roof {
    position: absolute; left: 2.5%; right: 2.5%; top: 6.5%; height: 15.8%;
  }
  .facade .roof svg { display: block; width: 100%; height: 100%; overflow: visible; }
  /* 簷下影：落在殿身與後方連續牆上＝出簷深度（收在建築包絡線內） */
  .facade .eave-shadow {
    position: absolute; left: 10%; right: 10%; top: 21.8%; height: 5.5%;
    background: linear-gradient(180deg, rgba(38, 33, 25, 0.38), transparent);
  }
  /* 門洞：退縮明間裡的入口——石作門框、門檻；內裡向下透一點暖 */
  .facade .doorway {
    position: absolute; left: 31.5%; right: 31.5%; top: 28%; bottom: 50%;
    background: linear-gradient(180deg, rgba(24, 21, 15, 0.9) 0%, rgba(38, 33, 25, 0.74) 55%, rgba(84, 66, 40, 0.5) 100%);
    border: 2px solid #b3aa93; border-bottom: 0;
  }
  .facade .doorway::after {
    content: ""; position: absolute; left: -5%; right: -5%; bottom: -2px; height: 5px;
    background: linear-gradient(90deg, #8a8168 0%, #9d947c 44% 56%, #8a8168 100%); /* 門檻中段被踏亮 */
  }
  .facade .doorway::before { /* 裡面有人：殿內的光極緩地呼吸，不是 portal */
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 58%;
    background: radial-gradient(80% 95% at 50% 100%, rgba(166, 120, 60, 0.2), transparent 75%);
    animation: hearth 9s ease-in-out infinite;
  }
  @keyframes hearth { 0%, 100% { opacity: 0.55; } 44% { opacity: 0.95; } 62% { opacity: 0.7; } }
  @media (prefers-reduced-motion: reduce) { .facade .doorway::before { animation: none; opacity: 0.65; } }
  /* 階：三級，由台基落到埕 */
  .facade .steps {
    position: absolute; left: 36%; right: 36%; top: 50.9%; height: 4.6%;
    clip-path: polygon(7% 0, 93% 0, 100% 100%, 0 100%);
    background: linear-gradient(180deg,
      #d6ceba 0%, #d6ceba 30%, #a9a18b 30%, #a9a18b 34%,
      #cbc3ae 34%, #cbc3ae 64%, #a29a84 64%, #a29a84 68%,
      #c0b8a3 68%, #c0b8a3 96%, #99917b 96%, #99917b 100%);
  }
  .facade .steps::after { /* 階心被走亮：人都從中間上 */
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent 32%, rgba(245, 239, 226, 0.24) 47% 53%, transparent 68%);
  }
  /* 聖名匾：深木沉金、細框、有年代——莊重安靜，不發光（Round 5.5） */
  .facade .plaque2 {
    position: absolute; left: 50%; top: 23.2%; transform: translateX(-50%);
    background: linear-gradient(180deg, #3d352a 0%, #2e2822 55%, #262019 100%);
    border: 1px solid rgba(20, 16, 11, 0.9);
    box-shadow:
      inset 0 0 0 2px rgba(191, 160, 94, 0.5),
      inset 0 0 0 3px rgba(20, 16, 11, 0.6),
      inset 0 1px 1px rgba(245, 239, 226, 0.07),
      0 2px 4px rgba(38, 33, 25, 0.45);
    font-family: "Noto Serif TC", serif; font-weight: 700;
    font-size: 19px; letter-spacing: 0.3em; text-indent: 0.3em;
    padding: 8px 12px 7px; white-space: nowrap;
    color: #c2a262;
    text-shadow: 0 1px 1px rgba(0, 0, 0, 0.5);
  }
  .facade .last-mark2 {
    position: absolute; left: 50%; top: 58%; transform: translateX(-50%);
    font-size: 10px; letter-spacing: 0.2em; color: var(--ink-soft); white-space: nowrap;
  }
  /* ============ Lived layer：時間與人的痕跡 ============
     全部 pointer-events:none、不可互動、不進 facade 模板。
     局部聚集＋留白＋非對稱；位置以站序（相對 void）推算——
     痕跡屬於地方，不屬於任何一位（無 per-hall styling 分支）。 */
  .lived { position: absolute; pointer-events: none; }
  .lived.bench { /* 等的人坐的長凳（≈1.5m），沒擺得很正 */
    bottom: 44.4%; margin-bottom: 19px; width: 88px; height: 7px;
    background: linear-gradient(180deg, #a4967a, #8a7c60);
    border: 1px solid rgba(74, 66, 52, 0.4);
    transform: rotate(-0.7deg);
  }

  .lived.bench-brick { /* 磚砌矮台：有人會坐、會靠、會等人的地方 */

  /* 未落成（假設性增建）：只有放樣輪廓 */
  .station.hypothetical .facade .body {
    background: none;
    border: 1px dashed rgba(74, 66, 52, 0.5);
    box-shadow: none;
  }
  .station.hypothetical .facade .doorway {
    background: rgba(38, 33, 25, 0.06);
    border: 1px dashed rgba(74, 66, 52, 0.5);
  }
  .station.hypothetical .facade .doorway::after { display: none; }
  .station.hypothetical .facade .doorway::before { display: none; } /* 未落成，裡面沒有人 */
  /* 放樣中的柱、台基、階：只有放樣輪廓，未砌石 */
  .station.hypothetical .facade .col,
  .station.hypothetical .facade .podium,
  .station.hypothetical .facade .steps {
    background: rgba(38, 33, 25, 0.04);
    border: 1px dashed rgba(74, 66, 52, 0.5);
    box-shadow: none; clip-path: none;
  }
  .station.hypothetical .facade .col::after { display: none; }
  .station.hypothetical .facade .recess,
  .station.hypothetical .facade .frieze,
  .station.hypothetical .facade .panel { display: none; }
  /* 未落成＝未開光：無獅、無供奉、無雕飾彩繪 */
  .station.hypothetical .facade .lion,
  .station.hypothetical .facade .altar,
  .station.hypothetical .facade .carve { display: none; }
  /* 放樣中的屋頂：同一骨架，只剩虛線輪廓（脊與簷口留形，屋面未上瓦） */
  .station.hypothetical .roof .r-face {
    fill: none; stroke: rgba(74, 66, 52, 0.5); stroke-width: 1.2; stroke-dasharray: 5 4;
  }
  .station.hypothetical .roof .r-ridge {
    fill: none; stroke: rgba(74, 66, 52, 0.5); stroke-width: 1.2; stroke-dasharray: 5 4;
  }
  .station.hypothetical .roof .r-eave { stroke: rgba(74, 66, 52, 0.5); stroke-width: 1.5; stroke-dasharray: 5 4; }
  .station.hypothetical .roof .r-tiles,
  .station.hypothetical .roof .r-eaveline,
  .station.hypothetical .roof .r-curl { display: none; }
  .station.hypothetical .facade .eave-shadow { display: none; }
  /* 月老未落成：暫掛的紙名條，不是聖名匾 */
  .station.hypothetical .plaque2 {
    background: var(--paper); color: var(--ink-soft);
    border: 1px dashed rgba(74, 66, 52, 0.55);
    box-shadow: none; text-shadow: none;
    font-size: 18px; font-weight: 650; padding: 6px 9px 5px;
    opacity: 0.8;
  }
  .build-mark2 {
    position: absolute; left: 50%; top: 40%; transform: translateX(-50%);
    font-size: 11px; letter-spacing: 0.3em; color: var(--cinnabar); white-space: nowrap;
  }

  /* 中軸空段＝牆上的刻字與沿革碑：埕的邊界，不是誰的殿 */
  .station.void-station { pointer-events: auto; cursor: default; }
  .void-heart {
    position: absolute; left: 0; right: 0; top: 30%;
    text-align: center;
    color: rgba(64, 57, 44, 0.85);
    font-family: "Noto Serif TC", serif; font-weight: 500;
    font-size: 14px; letter-spacing: 0.42em; text-indent: 0.42em;
    white-space: nowrap;
  }
  .void-chron {
    position: absolute; left: 50%; top: 37%; transform: translateX(-50%);
  }
  .void-chron button {
    background: var(--paper);
    border: 1px solid rgba(74, 66, 52, 0.55); border-top: 2.5px solid rgba(74, 66, 52, 0.7);
    font: inherit; font-family: "Noto Serif TC", serif;
    font-size: 11.5px; letter-spacing: 0.3em; text-indent: 0.3em;
    color: var(--ink-soft); cursor: pointer; pointer-events: auto;
    padding: 6px 10px 5px;
    box-shadow: 0 1px 2px rgba(38, 33, 25, 0.25);
  }

  /* 地面（0.9x 鋪面縫＋固定光帶＋引路） */
  .ground-fixed {
    position: absolute; left: 0; right: 0; top: 54%; bottom: 0;
    background:
      radial-gradient(46% 24% at 50% 58%, rgba(245, 239, 226, 0.16), transparent 76%),
      linear-gradient(180deg, #c9c1ac 0%, var(--ground) 30%, #ddd6c5 100%);
  }
  .ground-joints {
    position: absolute; top: 54%; bottom: 0; display: flex;
    will-change: transform;
  }
  .ground-joints i {
    display: block; width: 1px; margin-right: 92px;
    background: linear-gradient(180deg, rgba(74, 66, 52, 0.16), rgba(74, 66, 52, 0.04));
    transform: rotate(0.001deg);
  }
  .ground-path {
    position: absolute; left: 50%; bottom: 0; top: 54%;
    width: 190px; transform: translateX(-50%);
    background: linear-gradient(180deg, rgba(245, 239, 226, 0.22), rgba(245, 239, 226, 0.05));
    clip-path: polygon(41% 0, 59% 0, 100% 100%, 0 100%);
    transition: opacity 320ms ease;
  }

  /* 近景（1.55x）：柱，站與站之間；正對時在畫框外，轉身時掃過 */
  .near-strip { position: absolute; inset: 0; will-change: transform; }
  .near-strip i {
    position: absolute; top: -4%; bottom: -2%; width: 34px;
    background: linear-gradient(90deg, #b9b19c 0%, #a8a08b 45%, #90886f 100%);
    border-left: 1px solid rgba(245, 239, 226, 0.35);
    border-right: 2px solid rgba(38, 33, 25, 0.45);
  }

  .turn-hint {
    position: absolute; left: 0; right: 0; bottom: 8px;
    text-align: center; font-size: 11px; letter-spacing: 0.26em; text-indent: 0.26em;
    color: rgba(111, 103, 87, 0.75); pointer-events: none;
    transition: opacity 400ms ease;
  }

  /* 案：在你身邊（畫面底部），不在埕中央 */
  .desk {
    flex: 0 0 auto;
    background: linear-gradient(180deg, rgba(245, 239, 226, 0.0), rgba(245, 239, 226, 0.72) 26%, rgba(245, 239, 226, 0.92));
    border-top: 1px solid rgba(74, 66, 52, 0.42);
    padding: 18px 20px calc(18px + env(safe-area-inset-bottom));
    display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: end;
  }
  /* 「聲」：空間空氣的開關——案上一顆、殿內同一顆（V2C；位置與預設值未拍板）。
     偏好記在 localStorage：空間公共，記憶（要不要聽）私人。 */
  .sound-toggle {
    background: none;
    border: 1px solid rgba(74, 66, 52, 0.45);
    font: inherit; font-family: "Noto Serif TC", serif; font-weight: 500;
    font-size: 13px; line-height: 1;
    width: 28px; height: 28px; padding: 0;
    color: var(--ink-soft); cursor: pointer;
    position: relative;
  }
  .sound-toggle.off { color: rgba(111, 103, 87, 0.45); border-color: rgba(74, 66, 52, 0.22); }
  .sound-toggle.off::after { /* 一道斜線＝暫且不聽 */
    content: ""; position: absolute; left: 5px; right: 5px; top: 50%; height: 1px;
    background: rgba(111, 103, 87, 0.55);
    transform: rotate(-28deg);
  }
  .book-object {
    background: var(--paper);
    border: 1px solid var(--rule);
    box-shadow: 2px 2px 0 -1px var(--paper), 2px 2px 0 0 var(--rule);
    padding: 10px 8px 12px;
    writing-mode: vertical-rl;
    font-family: "Noto Serif TC", serif; font-weight: 600;
    font-size: 14px; letter-spacing: 0.2em;
    cursor: pointer;
    display: flex; align-items: center; gap: 6px;
  }
  .book-object .count {
    writing-mode: horizontal-tb;
    font-family: "Noto Sans TC", sans-serif; font-weight: 400;
    font-size: 10px; color: var(--ink-soft); letter-spacing: 0.1em;
  }
  .ask-zone { display: grid; gap: 8px; }
  .ask-label { font-size: 11px; letter-spacing: 0.26em; color: var(--ink-soft); }
  .ask-zone textarea {
    width: 100%; min-height: 44px; max-height: 96px;
    background: transparent; border: 0; border-bottom: 1px solid rgba(74, 66, 52, 0.45);

  .ask-zone textarea:focus { outline: none; border-bottom-color: var(--ink); }
  .ask-zone textarea::placeholder { color: #a79d8a; }
  .bound-strip {
    font-size: 12.5px; line-height: 1.7; color: var(--ink-soft);
    border-left: 2px solid var(--cinnabar); padding-left: 10px;
    cursor: pointer;
  }
  .walk-hint { font-size: 11px; letter-spacing: 0.14em; color: rgba(111, 103, 87, 0.85); }

  /* ============ 殿 ============ */
  /* 殿內的光不是燈箱：上方一團暖（燭），往下沉入地色 */
  #s-hall {
    background:
      radial-gradient(340px 300px at 50% 9%, rgba(190, 150, 90, 0.12), transparent 72%),
      linear-gradient(180deg, #cfc7b2 0%, var(--ground) 30%);
    overflow-y: auto;
  }
  .hall-top {
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: calc(10px + env(safe-area-inset-top)) 14px 0;
  }
  .hall-back {
    background: none; border: 0; font: inherit; font-size: 13px;
    letter-spacing: 0.2em; color: var(--ink-soft); cursor: pointer; padding: 8px;
  }
  .hall-body { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 0 20px 40px; }
  /* 聖號：殿內唯一的不對稱——比誰都大，位於上方 */
  .tablet {
    margin-top: 2px;
    writing-mode: vertical-rl;
    font-family: "Noto Serif TC", serif; font-weight: 700;
    --tablet-fs: clamp(52px, 17vw, 68px); /* 匾同規格：字級基準；字多則隨匾縮（renderHall） */
    font-size: var(--tablet-fs);
    letter-spacing: 0.28em;
    line-height: 1.05;
    color: var(--ink);
    border: 2px solid var(--rule);
    border-top: 6px solid var(--rule);
    background: var(--paper);
    padding: 26px 12px 30px;
    box-shadow: 0 2px 3px rgba(38, 33, 25, 0.2);
  }
  .hall-sub {
    margin-top: 12px;
    font-size: 11.5px; letter-spacing: 0.3em; text-indent: 0.3em;
    color: var(--ink-soft);
  }
  /* 案前小香爐：爐裡有灰、枝插得不齊、一縷極輕的煙——剛有人來過 */

<script>
/* ==================== sound-layer:begin ====================
   ARRIVAL_SOUND — 空間的空氣，不是音效（V2C：weather ticket 拍板版）。

   治理契約（source-level 斷言見 scripts/test-sound.mjs）：
   - 聲音層只收空間狀態（court/hall/slip/weather/樹的視野位置），
     零 mechanics 引用：不讀抽籤 policy、不讀籤池、不讀任何神明身分。
   - 三殿 equality：hall 變換參數只有一份字面值（SPACES.hall），
     且天氣永不出現在 SPACES——殿不知道天氣，殿只知道「外面」。
   - 增建殿 fail-closed 在呼叫端（enterHall guard）：增建中無殿內聲態。
   - 全合成（噪音整形）：零音檔、零下載、零振盪器——
     無音高源；一切事件隨機排程＝無週期 LFO。合成即誠實。
     （鳥聲＝高 Q 共振噪音、蟬＝窄帶噪音潮——仍是噪音家族，做假即殺。）
   - 天氣票（Crystal 拍板 2026-08-21）：同一座廟、同一副骨架
     （空氣×樹×牆外世界），天氣只增減聲部。visit 內固定。
     目前掛 ?weather= dev flag 試聽；入口 ritual 等回訪門檻拍板。
   - AudioContext 只在手勢後啟動；山門無聲（提案狀態）。
   - 「聲」偏好記在 localStorage（記憶私人）；預設開（provisional）。
   - 展籤＝世界閉嘴：The Slip is protagonist。
   - 裝置時鐘只用於「合適季節的蟬」（月份）——void 刻字既有先例。
   ============================================================ */
window.ARRIVAL_SOUND = (function () {
  "use strict";
  const PREF_KEY = "arrival.sound.v1";

  /* —— 空間變換表（唯一事實來源；殿內＝常數層＋同一扇窗，無天氣分支）—— */
  const SPACES = {
    court: { busLP: 800, busGain: 1.0, leafLP: 4200, leafGain: 1.0, exLP: 6000, exGain: 1.0, interior: 0 },

  const WEATHERS = {
    sunny:  { air: 0.012, airLP: 280, windIdle: 0.001, windPeak: 0.010, leafIdle: 0.002, leafPeak: 0.020,
              gustWaitMin: 45, gustWaitMax: 100, gustLenMin: 2, gustLenMax: 6, double: 0.05,

    cloudy: { air: 0.018, airLP: 200, windIdle: 0.002, windPeak: 0.016, leafIdle: 0.003, leafPeak: 0.024,
              gustWaitMin: 20, gustWaitMax: 70, gustLenMin: 2, gustLenMax: 8, double: 0.05,
              distant: 0.009, rainOn: 0, voices: false },
    rain:   { air: 0.012, airLP: 180, windIdle: 0.001, windPeak: 0.008, leafIdle: 0.002, leafPeak: 0.012,
              gustWaitMin: 60, gustWaitMax: 140, gustLenMin: 2, gustLenMax: 5, double: 0,
              distant: 0.002, rainOn: 1, voices: false },
    wind:   { air: 0.022, airLP: 220, windIdle: 0.005, windPeak: 0.045, leafIdle: 0.007, leafPeak: 0.055,
              gustWaitMin: 10, gustWaitMax: 32, gustLenMin: 3, gustLenMax: 9, double: 0.22,
              distant: 0.005, rainOn: 0, voices: false },

  const LEVELS = {
    master: 0.5,       // 總閘
    slipDuck: 0.0001,  // 展籤：世界退到聽不見
    rainWash: 0.008,   // 遠雨（雨的身體——這個值決定雨勢：疏雨，不是西北雨）

    voiceCicada: 0.004, voiceBird: 0.006, voiceBike: 0.005, // 晴的 lived voices（各自可單殺）
    handPull: 0.020,  // 手感層：筒內竹籤的細碎摩擦（拖籤時，跟手）
    handStick: 0.030, // 手感層：籤枝離筒的一下輕竹響
    handPaper: 0.022, // 手感層：取籤詩的紙聲（纖維，不是 whoosh）
  };
  const XFADE = 0.4;     // 進殿／回埕 crossfade（秒）＝與視覺 400ms 轉場同步

  const GUST_LAG = { leafMin: 0.10, leafMax: 0.30 }; // 風先起，葉晚 100–300ms

  let ctx = null, started = false;
  let enabled = readPref();
  let space = "court";      // 物理空間："court" | "hall"
  let slipOpen = false;     // 展籤 overlay 狀態
  let weather = "cloudy";   // 天氣票（visit-fixed；預設＝陰基準）
  let n = null;             // node graph
  const timers = {};        // 全部隨機 setTimeout 排程——沒有節拍器

  function readPref() {
    try { const v = localStorage.getItem(PREF_KEY); return v === null ? true : v === "true"; }
    catch { return true; }
  }
  function writePref(v) { try { localStorage.setItem(PREF_KEY, String(v)); } catch {} }
  const rand = (a, b) => a + Math.random() * (b - a);
  const W = () => WEATHERS[weather];
  const running = () => n && enabled && ctx.state === "running";
  function loopTimer(key, fn, minS, maxS, firstScale = 1) { // 隨機間隔迴圈；首發可提早（世界不讓人乾等）
    clearTimeout(timers[key]);
    const step = () => { fn(); timers[key] = setTimeout(step, rand(minS, maxS) * 1000); };
    timers[key] = setTimeout(step, rand(minS, maxS) * firstScale * 1000);
  }

  /* ---- 噪音家族（唯一的合成原料）---- */
  function noiseBuffer(kind, seconds) {
    const len = Math.floor(ctx.sampleRate * seconds);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    if (kind === "brown") { // 漏積分白噪：能量集中低頻，聽不出「訊號感」
      let last = 0;
      for (let i = 0; i < len; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.5; }
    } else {
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    return buf;
  }
  // 稀疏 transient 粒子（雨滴／滴答／棘輪）：建 buffer 時把粒子種好；
  // 同一 buffer 兩個異速 source 疊放＝週期互質，聽不出 loop。
  function grainBuffer(seconds, density, minMs, maxMs) {
    const len = Math.floor(ctx.sampleRate * seconds);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let g = 0; g < Math.floor(seconds * density); g++) {
      const at = Math.floor(Math.random() * len);
      const dur = Math.floor(ctx.sampleRate * rand(minMs, maxMs) / 1000);
      const a = (0.25 + Math.random() * 0.75) ** 2;
      // 半正弦包絡＝軟起音：硬起音的顆粒是米粒落地，不是水（taste gate r3）
      for (let i = 0; i < dur && at + i < len; i++) d[at + i] += (Math.random() * 2 - 1) * a * Math.sin(Math.PI * i / dur);
    }
    return buf;
  }
  function src(buf, rate) {
    const s = ctx.createBufferSource();
    s.buffer = buf; s.loop = true;
    if (rate) s.playbackRate.value = rate;
    return s;
  }
  function biquad(type, freq, q) {
    const f = ctx.createBiquadFilter();
    f.type = type; f.frequency.value = freq; f.Q.value = q;
    return f;
  }
  function gainNode(v) { const g = ctx.createGain(); g.gain.value = v; return g; }

  /* ---- 骨架：四張票共用的一套樂器 ---- */
  function build() {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    const brown = noiseBuffer("brown", 5);
    const white = noiseBuffer("white", 3);
    n = {};
    n.master = gainNode(0); // 空氣是浮現的，不是開機音
    n.world = gainNode(1);  // slip duck 作用在這（殿內層也一起閉嘴）
    n.world.connect(n.master); n.master.connect(ctx.destination);

    // 戶外低頻 bus：air bed＋風＋牆外世界（無 pan）。進殿收窄的是這條。
    n.busLP = biquad("lowpass", SPACES.court.busLP, 0.4);
    n.busGain = gainNode(SPACES.court.busGain);
    n.busLP.connect(n.busGain); n.busGain.connect(n.world);

    n.airSrc = src(brown);
    n.airLP = biquad("lowpass", W().airLP, 0.5);
    n.airGain = gainNode(W().air);
    n.airSrc.connect(n.airLP); n.airLP.connect(n.airGain); n.airGain.connect(n.busLP);

    n.windSrc = src(brown, 0.82);
    n.windBP = biquad("bandpass", 140, 0.5);
    n.windGain = gainNode(W().windIdle);
    n.windSrc.connect(n.windBP); n.windBP.connect(n.windGain); n.windGain.connect(n.busLP);

    // 牆外世界（遠方生活感）：不可辨識的鈍存在。陰天它走近，熱天它退遠。
    n.distSrc = src(brown, 0.6);
    n.distBP = biquad("bandpass", 320, 0.4);
    n.distGain = gainNode(W().distant);
    n.distSrc.connect(n.distBP); n.distBP.connect(n.distGain); n.distGain.connect(n.busLP);

    // 葉鏈：dyn/flut 在前（只調葉），space/view 在後（樹冠雨從中段匯入＝
    // 雨在樹上跟著樹 pan、跟著進殿收窄——「這座埕在下雨」的關鍵）。
    n.leafSrc = src(white);
    n.leafBP = biquad("bandpass", 3000, 0.55);
    n.leafDyn = gainNode(W().leafIdle);
    n.leafFlut = gainNode(0.8);
    n.leafSpaceLP = biquad("lowpass", SPACES.court.leafLP, 0.4);
    n.leafViewLP = biquad("lowpass", 5200, 0.4);
    n.leafViewGain = gainNode(1);
    n.leafSpaceGain = gainNode(SPACES.court.leafGain);
    n.pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
    let tail = n.leafSrc;
    for (const nd of [n.leafBP, n.leafDyn, n.leafFlut, n.leafSpaceLP, n.leafViewLP, n.leafViewGain, n.leafSpaceGain]) {
      tail.connect(nd); tail = nd;
    }
    if (n.pan) { tail.connect(n.pan); n.pan.connect(n.world); }
    else tail.connect(n.world);

    // 高頻外物 bus（雨石地／簷滴／晴 voices）：自己的窗，進殿一樣收窄
    n.exBus = gainNode(1);
    n.exLP = biquad("lowpass", SPACES.court.exLP, 0.4);
    n.exGain = gainNode(SPACES.court.exGain);
    n.exBus.connect(n.exLP); n.exLP.connect(n.exGain); n.exGain.connect(n.world);

    // 殿內 presence：被牆包住的空氣（三殿同一份常數；埕內為零）
    n.intSrc = src(brown, 0.5);
    n.intLP = biquad("lowpass", 100, 0.5);
    n.intGain = gainNode(SPACES.court.interior);
    n.intSrc.connect(n.intLP); n.intLP.connect(n.intGain); n.intGain.connect(n.world);

    n.airSrc.start(); n.windSrc.start(rand(0, 2)); n.leafSrc.start(rand(0, 1.5));
    n.distSrc.start(rand(0, 2)); n.intSrc.start(rand(0, 1));
  }

  /* ---- 雨（lazy）：石地×樹冠×簷滴×遠洗——地方在出聲，不是 rain track ---- */
  function ensureRain() {
    if (n.rain) return;
    const r = n.rain = {};
    r.master = gainNode(0); r.master.connect(n.exBus);
    r.washSrc = src(noiseBuffer("white", 3), 0.9);
    r.washLP = biquad("lowpass", 1000, 0.4);
    r.washGain = gainNode(LEVELS.rainWash);
    r.washSrc.connect(r.washLP); r.washLP.connect(r.washGain); r.washGain.connect(r.master);
    const stoneBuf = grainBuffer(8, 14, 5, 14); // 疏雨：粒子稀一點，聽得見雨與雨之間
    r.stoneBP = biquad("bandpass", 2700, 0.65); // 壓亮度：石地的雨不是敲的
    r.stoneGain = gainNode(LEVELS.rainStone);
    r.stoneBP.connect(r.stoneGain); r.stoneGain.connect(r.master);
    for (const rate of [1, 0.937]) { const s = src(stoneBuf, rate); s.connect(r.stoneBP); s.start(rand(0, 4)); }
    const canopyBuf = grainBuffer(6, 90, 2, 5);
    r.canopyBP = biquad("bandpass", 1700, 0.5);
    r.canopyGain = gainNode(0);
    r.canopyBP.connect(r.canopyGain); r.canopyGain.connect(n.leafSpaceLP); // 匯入葉鏈中段
    for (const rate of [1, 0.911]) { const s = src(canopyBuf, rate); s.connect(r.canopyBP); s.start(rand(0, 3)); }
    r.dripBuf = grainBuffer(0.05, 24, 4, 10); // 一顆
    r.washSrc.start(rand(0, 2));
  }
  function dripOnce() {
    if (!running() || !W().rainOn || !n.rain) return;
    const t0 = ctx.currentTime + 0.02;
    const s = ctx.createBufferSource();
    s.buffer = n.rain.dripBuf; s.playbackRate.value = rand(0.85, 1.3);
    // 水滴的「啵」＝氣泡共振：高 Q 窄帶＋音高上滑（米粒是乾的，水會滑）
    const f0 = rand(900, 1600);
    const bp = biquad("bandpass", f0 * 0.72, 9);
    bp.frequency.setValueAtTime(f0 * 0.72, t0);
    bp.frequency.setTargetAtTime(f0, t0 + 0.008, 0.022);
    const g = gainNode(LEVELS.rainDrip * rand(0.4, 1));
    s.connect(bp); bp.connect(g); g.connect(n.rain.master);
    s.start(t0); s.stop(t0 + 0.3);
  }
  function rainBreath() { // 雨的呼吸：忽大忽小，不是恆定音床
    if (!n.rain || !W().rainOn) return;
    const t = ctx.currentTime, v = rand(0.55, 1.15);
    n.rain.master.gain.setTargetAtTime(v, t, 3);
    n.rain.canopyGain.gain.setTargetAtTime(LEVELS.rainCanopy * v, t, 3);
  }

  /* ---- 晴的 lived voices（lazy；不固定 loop，沒有哪個聲音是晴天 icon）---- */
  function ensureVoices() {
    if (n.v) return;
    const v = n.v = {};
    v.chirpBuf = grainBuffer(0.09, 12, 60, 90);
    // 蟬：合適季節才有（5–9 月，裝置時鐘＝void 刻字先例）。遠處蟬潮，不是一隻。
    v.cicadaOn = new Date().getMonth() + 1 >= 5 && new Date().getMonth() + 1 <= 9;
    if (v.cicadaOn) {
      v.cicSrc = src(noiseBuffer("white", 2));
      v.cicBP = biquad("bandpass", 5200, 9);
      v.cicPulse = gainNode(0.8);
      v.cicGain = gainNode(0);
      v.cicSrc.connect(v.cicBP); v.cicBP.connect(v.cicPulse); v.cicPulse.connect(v.cicGain); v.cicGain.connect(n.exBus);
      v.cicSrc.start();
    }
    // 腳踏車棘輪：一串 tick，經過就走
    v.bikeBuf = (() => {
      const buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 3), ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let t = 0.05; t < 2.9; t += rand(0.055, 0.09)) {
        const at = Math.floor(t * ctx.sampleRate), dur = Math.floor(ctx.sampleRate * 0.003);
        for (let i = 0; i < dur; i++) d[at + i] = (Math.random() * 2 - 1) * (1 - i / dur);
      }
      return buf;
    })();
  }
  function cicadaWave() { // 蟬潮起落：有時整段沒有
    if (!running() || !W().voices || !n.v?.cicadaOn) return;
    const quiet = Math.random() < 0.3;
    n.v.cicGain.gain.setTargetAtTime(quiet ? 0 : LEVELS.voiceCicada * rand(0.3, 1), ctx.currentTime, 6);
  }
  function cicadaPulse() { // 蟬的顆粒感：快而不規則的振幅抖動
    if (running() && W().voices && n.v?.cicadaOn) n.v.cicPulse.gain.setTargetAtTime(rand(0.35, 1), ctx.currentTime, 0.05);
  }
  function birdChirp() { // 遠處鳥聲：高 Q 共振噪音掃頻——像不像由 Crystal 判，做假即殺
    if (!running() || !W().voices || Math.random() < 0.4) return;
    const t0 = ctx.currentTime + 0.05;
    const f0 = rand(2500, 3400);
    const syll = 2 + Math.floor(Math.random() * 3);
    for (let i = 0; i < syll; i++) {
      const at = t0 + i * rand(0.12, 0.26);
      const s = ctx.createBufferSource(); s.buffer = n.v.chirpBuf;
      const bp = biquad("bandpass", f0 * rand(0.95, 1.05), 16);
      bp.frequency.setValueAtTime(bp.frequency.value, at);
      bp.frequency.setTargetAtTime(bp.frequency.value * (Math.random() < 0.5 ? rand(1.12, 1.28) : rand(0.78, 0.9)), at + 0.015, 0.035);
      const g = gainNode(0);
      g.gain.setValueAtTime(0, at);
      g.gain.setTargetAtTime(LEVELS.voiceBird, at + 0.002, 0.015);
      g.gain.setTargetAtTime(0, at + 0.07, 0.03);
      s.connect(bp); bp.connect(g); g.connect(n.exBus);
      s.start(at); s.stop(at + 0.25);
    }
  }
  function bikePass() { // 遠方腳踏車：偶爾一台，經過就沒有了
    if (!running() || !W().voices || Math.random() < 0.45) return;
    const t0 = ctx.currentTime + 0.05, dur = rand(2.6, 3.4);
    const s = ctx.createBufferSource(); s.buffer = n.v.bikeBuf; s.playbackRate.value = rand(0.92, 1.08);
    const bp = biquad("bandpass", 2200, 1);
    const g = gainNode(0);
    g.gain.setTargetAtTime(LEVELS.voiceBike, t0, dur * 0.35);
    g.gain.setTargetAtTime(0, t0 + dur * 0.5, dur * 0.28);
    s.connect(bp); bp.connect(g);
    if (ctx.createStereoPanner) {
      const p = ctx.createStereoPanner();
      const dir = Math.random() < 0.5 ? 1 : -1;
      p.pan.setValueAtTime(-0.18 * dir, t0);
      p.pan.linearRampToValueAtTime(0.18 * dir, t0 + dur);
      g.connect(p); p.connect(n.exBus);
    } else g.connect(n.exBus);
    s.start(t0); s.stop(t0 + dur + 0.3);
  }

  /* ---- 手感層（Phase B）：手上的東西，不是空氣 ----
     走 master 不走 world——展籤時世界閉嘴，但紙自己的聲音是紙登場的一部分。
     動作回饋不是音效：極小聲、乾、短，永不搶過視覺。收 gesture 進度與
     動作事件（主程式推播），零 mechanics 引用；增建殿無 draw path＝天生無聲。 */
  let pullAcc = 0, pullLast = 0;
  function ensureHand() {
    if (n.hand) return;
    n.hand = gainNode(1);
    n.hand.connect(n.master); // 不過 world：slip duck 靜的是世界，不是你的手
    n.tickBuf = grainBuffer(0.012, 90, 5, 9);    // 一顆竹籤 tick
    n.paperBuf = grainBuffer(0.22, 900, 1.5, 4); // 紙的細碎纖維
  }
  function pull(p) { // 拖籤枝：筒內竹籤的細碎摩擦，跟著手走
    if (!running()) return;
    ensureHand();
    if (p < pullLast - 0.2) pullAcc = 0; // 鬆手回彈＝重新開始
    if (p > pullLast) pullAcc += p - pullLast;
    pullLast = p;
    if (pullAcc < 0.07) return; // 每前進約 7% 才一粒——疏，不是馬達
    pullAcc = 0;
    const t0 = ctx.currentTime + 0.005;
    const s = ctx.createBufferSource();
    s.buffer = n.tickBuf; s.playbackRate.value = rand(0.8, 1.25);
    const bp = biquad("bandpass", rand(1600, 2500), 2.5);
    const g = gainNode(LEVELS.handPull * rand(0.5, 1));
    s.connect(bp); bp.connect(g); g.connect(n.hand);
    s.start(t0); s.stop(t0 + 0.1);
  }
  function stickOut() { // 籤枝離筒：兩下極輕的竹響——結果的重量在紙上，不在這
    if (!running()) return;
    ensureHand();
    const t0 = ctx.currentTime + 0.01;
    for (const [f, q, g0, dt] of [[2100, 3, LEVELS.handStick * 0.6, 0], [1150, 6, LEVELS.handStick, 0.018]]) {
      const s = ctx.createBufferSource();
      s.buffer = n.tickBuf; s.playbackRate.value = rand(0.9, 1.1);
      const bp = biquad("bandpass", f, q);
      const g = gainNode(g0);
      s.connect(bp); bp.connect(g); g.connect(n.hand);
      s.start(t0 + dt); s.stop(t0 + dt + 0.12);
    }
  }
  function paperOut() { // 取籤詩：一次紙的滑動——纖維的粗糙，不是 whoosh
    if (!running()) return;
    ensureHand();
    const t0 = ctx.currentTime + 0.01;
    const s = ctx.createBufferSource();
    s.buffer = n.paperBuf; s.playbackRate.value = rand(0.95, 1.1);
    const bp = biquad("bandpass", 3300, 0.8);
    bp.frequency.setTargetAtTime(2100, t0 + 0.05, 0.08); // 亮→鈍＝紙滑到底
    const g = gainNode(0);
    g.gain.setValueAtTime(0, t0);
    g.gain.setTargetAtTime(LEVELS.handPaper, t0, 0.045);
    g.gain.setTargetAtTime(0, t0 + 0.13, 0.05);
    s.connect(bp); bp.connect(g); g.connect(n.hand);
    s.start(t0); s.stop(t0 + 0.4);
  }
  let nudgeGate = 0;
  function nudge() { // 轉身中點擊的回饋：比 pull 還輕一顆——「聽見了，在動」
    if (!running()) return;
    ensureHand();
    const t0 = ctx.currentTime + 0.005;
    if (t0 < nudgeGate) return; // 單一活躍源：上一顆還沒落地就不起第二顆——高速連點不疊音
    nudgeGate = t0 + 0.08;      // 窗口＝聲音本體的長度；過窗才允許下一顆
    const s = ctx.createBufferSource();
    s.buffer = n.tickBuf; s.playbackRate.value = rand(0.7, 0.9);
    const bp = biquad("bandpass", rand(800, 1200), 3.5);
    const g = gainNode(LEVELS.handPull * 0.35); // 比 pull 輕一截——背景，不是事件
    s.connect(bp); bp.connect(g); g.connect(n.hand);
    s.start(t0); s.stop(t0 + 0.08);
  }

  /* ---- 狀態套用 ---- */
  function applyState(dur = XFADE) { // 空間變換：對「任何室外」做同一件事
    if (!n) return;
    const t = ctx.currentTime, tc = Math.max(0.05, dur / 3);
    const p = SPACES[space];
    n.busLP.frequency.setTargetAtTime(p.busLP, t, tc);
    n.busGain.gain.setTargetAtTime(p.busGain, t, tc);
    n.leafSpaceLP.frequency.setTargetAtTime(p.leafLP, t, tc);
    n.leafSpaceGain.gain.setTargetAtTime(p.leafGain, t, tc);
    n.exLP.frequency.setTargetAtTime(p.exLP, t, tc);
    n.exGain.gain.setTargetAtTime(p.exGain, t, tc);
    n.intGain.gain.setTargetAtTime(p.interior, t, tc);
    // 紙登場世界快讓位（~250ms 靜下）；回來時空氣慢慢展開（~600ms）
    n.world.gain.setTargetAtTime(slipOpen ? LEVELS.slipDuck : 1, t, slipOpen ? 0.09 : 0.2);
  }
  function applyWeather(dur = 1.2) { // 換票（visit 內只在 boot 發生一次）
    if (!n) return;
    const t = ctx.currentTime, tc = Math.max(0.1, dur / 3);
    const w = W();
    n.airGain.gain.setTargetAtTime(w.air, t, tc);
    n.airLP.frequency.setTargetAtTime(w.airLP, t, tc);
    n.windGain.gain.setTargetAtTime(w.windIdle, t, tc);
    n.leafDyn.gain.setTargetAtTime(w.leafIdle, t, tc);
    n.distGain.gain.setTargetAtTime(w.distant, t, tc);
    if (w.rainOn) {
      ensureRain();
      n.rain.master.gain.setTargetAtTime(1, t, 2); // 雨慢慢落起來，不是開關
      n.rain.canopyGain.gain.setTargetAtTime(LEVELS.rainCanopy, t, 2);
      loopTimer("drip", dripOnce, 0.7, 3.2);
      loopTimer("rainBreath", rainBreath, 6, 18);
    } else if (n.rain) {
      n.rain.master.gain.setTargetAtTime(0, t, 1.5);
      n.rain.canopyGain.gain.setTargetAtTime(0, t, 1.5);
      clearTimeout(timers.drip); clearTimeout(timers.rainBreath);
    }
    if (w.voices) {
      ensureVoices();
      loopTimer("cicadaWave", cicadaWave, 15, 50, 0.2); // 蟬早點在（3–10s 起第一潮）
      loopTimer("cicadaPulse", cicadaPulse, 0.06, 0.14);
      loopTimer("bird", birdChirp, 25, 75, 0.35);
      loopTimer("bike", bikePass, 150, 420, 0.4);
    } else if (n.v) {
      if (n.v.cicadaOn) n.v.cicGain.gain.setTargetAtTime(0, t, 1);
      for (const k of ["cicadaWave", "cicadaPulse", "bird", "bike"]) clearTimeout(timers[k]);
    }
    scheduleGust(0.3); // 第一陣風提早：入內後不用乾等一輪完整間隔
  }
  function rampMaster(on) {
    if (!n) return;
    n.master.gain.setTargetAtTime(on ? LEVELS.master : 0, ctx.currentTime, on ? 0.5 : 0.12);
  }

  /* 陣風：間隔／包絡依票（慢起慢退，無 whoosh、無週期、偶爾連兩陣）。
     風先起；葉晚 100–300ms 跟上、亮度微開——世界被風吹動。 */
  function scheduleGust(firstScale = 1) {
    clearTimeout(timers.gust);
    timers.gust = setTimeout(fireGust, rand(W().gustWaitMin, W().gustWaitMax) * firstScale * 1000);
  }
  function fireGust() {
    if (!running()) { scheduleGust(); return; }
    const w = W();
    const len = rand(w.gustLenMin, w.gustLenMax);
    const s = rand(0.25, 1);
    const attack = len * rand(0.3, 0.45), release = len - attack;
    const t0 = ctx.currentTime + 0.03;
    const wPeak = w.windIdle + (w.windPeak - w.windIdle) * s;
    n.windGain.gain.setTargetAtTime(wPeak, t0, attack / 2.6);
    n.windGain.gain.setTargetAtTime(w.windIdle, t0 + attack, release / 2.4);
    n.windBP.frequency.setTargetAtTime(140 + 130 * s, t0, attack / 2.2); // 重心隨風抬——不是定頻扇葉
    n.windBP.frequency.setTargetAtTime(140, t0 + attack, release / 2);
    const lag = rand(GUST_LAG.leafMin, GUST_LAG.leafMax);
    const lPeak = w.leafIdle + (w.leafPeak - w.leafIdle) * s;
    n.leafDyn.gain.setTargetAtTime(lPeak, t0 + lag, attack / 2.4);
    n.leafDyn.gain.setTargetAtTime(w.leafIdle, t0 + lag + attack, release / 2.2);
    n.leafBP.frequency.setTargetAtTime(3000 + 1000 * s, t0 + lag, attack / 2.2);
    n.leafBP.frequency.setTargetAtTime(3000, t0 + lag + attack, release / 2);
    if (Math.random() < w.double) timers.gust = setTimeout(fireGust, (len + rand(1.5, 4)) * 1000);
    else scheduleGust();
  }

    for (const [si, s] of STATIONS.entries()) {
      const st = document.createElement("div");
      st.className = "station" + (s.hypothetical ? " hypothetical" : "") + (s.void ? " void-station" : "");
      st.style.width = stationW + "px";
      if (s.void) {
        const d = new Date();
        const heart = document.createElement("div");
        heart.className = "void-heart";
        heart.textContent = `${cnNum(d.getMonth() + 1)}月${cnNum(d.getDate())}日・${currentTerm(d)}`;
        // 票的回聲：地方把你的票寫進今天的石頭。常日不刻（unmarked default 不留痕）
        // 亂值票同常日：isValidWeather 擋 prototype chain 穿透（toString/__proto__ 等不刻）
        const wName = AUDITION_WEATHER ?? todaysTicket()?.weather;
        const wChar = isValidWeather(wName) ? WEATHER_CHARS[wName] : null;
        if (wChar) heart.textContent += `・${wChar}`;
        const chron = document.createElement("div");
        chron.className = "void-chron";
        const b = document.createElement("button");
        b.textContent = "本廟沿革";
        b.dataset.chron = "1";
        chron.appendChild(b);
        st.append(heart, chron);
      } else {
        const f = document.createElement("div");
        f.className = "facade";
        f.dataset.hall = s.id;
        // 疊序＝建築邏輯：牆身→退縮明間→堵→台基階→門→供奉軸→石獅→柱→插角→屋頂（簷壓柱頭）→簷影
        for (const cls of ["body", "recess", "frieze", "panel panel-l", "panel panel-r",
          "podium", "steps", "doorway", "altar",
          "col col-ol", "col col-or", "col col-il", "col col-ir", "carve",
          "lion lion-l", "lion lion-r",
          "roof", "eave-shadow"]) {
          const el = document.createElement("div");
          el.className = cls;
          if (cls === "roof") el.innerHTML = ROOF_SVG;
          else if (cls === "altar") el.innerHTML = ALTAR_SVG;
          else if (cls === "carve") el.innerHTML = CARVE_SVG;
          else if (cls.startsWith("lion")) el.innerHTML = LION_SVG;
          f.appendChild(el);
        }
        const plq = document.createElement("div");
        plq.className = "plaque2";
        plq.textContent = s.deity;
        f.appendChild(plq);
        if (s.hypothetical) {
          const bm = document.createElement("div");
          bm.className = "build-mark2";
          bm.textContent = "增建中";
          f.appendChild(bm);
        } else if (lastHall?.id === s.id) {
          const lm = document.createElement("div");
          lm.className = "last-mark2";
          lm.textContent = "上次到訪・" + (lastHall.date ?? "");
          f.appendChild(lm);
        }
        st.appendChild(f);
        // 生活痕（站內、隨站 transform、不可互動；positional，不以神明分支）：
        // 已落成的殿階前都有一方拜墊（儀式同尊），擺位各自微偏——人放的，不是設計師放的
        if (!s.hypothetical) {
          const cu = document.createElement("div");
          cu.className = "lived cushion";
          cu.style.left = `calc(50% + ${((si * 47) % 17) - 8}px)`;
          cu.style.transform = `rotate(${((si * 29) % 7) - 3}deg)`;
          st.appendChild(cu);
        }
        // 中軸右一站的台基角補過（positional；補修是維護，不是位階）
        if (si === voidIndex + 1) {
          const pp = document.createElement("div");
          pp.className = "lived podpatch";
          st.appendChild(pp);
        }
      }
      stageStrip.appendChild(st);
    }
    dressCourt();

    /* --------------------------------------------------------------
       Lived layer（presentation only）：埕有人過日子的痕跡。
       局部聚集＋留白＋非對稱；全部 pointer-events:none，不新增 interaction；
       位置以站序（相對 void）推算——痕跡屬於地方，不屬於任何一位。
       中軸空段本身保持乾淨（治理留白不放東西）。
       -------------------------------------------------------------- */
    function dressCourt() {
      const put = (cls, x, style) => {
        const el = document.createElement("div");
        el.className = "lived " + cls;
        el.style.left = Math.round(x) + "px";
        if (style) Object.assign(el.style, style);
        stageStrip.appendChild(el);
        return el;
      };
      // ── Round 5：埕的生活（普通的下午）──
      // 老樹在埕的西端，早於三殿；?halls=4 時仍在工地更外側，永不擋殿。
      // 樹蔭先鋪（物件坐在影子上）；人間長在兩側，走向神前的路留在中央。
      const tx = -0.25 * stationW;
      treeSoundX = tx + 0.2 * stationW; // 葉聲來自樹冠質心（冠幅 tx-0.45W..tx+0.85W），不是樹幹
      put("tree-shade", tx - 0.3 * stationW, { width: Math.round(2.35 * stationW) + "px" });
      put("tree-shade-wall", tx - 0.15 * stationW, { width: Math.round(0.9 * stationW) + "px" });
      put("leafbits", tx + 0.5 * stationW);
      put("leafbits", tx + 1.05 * stationW, { top: "82%", width: "50px" });
      // 磚砌矮台兩座：樹蔭下一座（乘涼），遠處一座小的。
      // 錨在站界（殿門中心＝strip (i+0.5)W；站界＝iW）——永不落在任何殿的正前方
      put("bench-brick", voidIndex * stationW - 0.12 * stationW - 50, { width: "100px", height: "36px", bottom: "36.6%" });
      put("bench-brick", (voidIndex + 2) * stationW + 0.08 * stationW - 35, { width: "70px", height: "26px", bottom: "40%" });
      // 誰的腳踏車靠在牆邊（站界旁；成人車尺度）
      put("bike", (voidIndex + 1) * stationW - 62).innerHTML = BIKE_SVG; // 停在站界牆前，離殿身淨空
      // 樹身與樹冠（最後畫：樹在建築之前）
      put("tree-trunk", tx - 23).innerHTML = TRUNK_SVG;
      put("tree-canopy", tx - 0.45 * stationW, { width: Math.round(1.3 * stationW) + "px" }).innerHTML = CANOPY_SVG;
      // 今晨有人掃過：帚靠牆、葉掃攏一小堆（中軸左一站的外緣）
      put("broom", (voidIndex - 1 + 0.06) * stationW);
      put("leaves", (voidIndex - 1 + 0.045) * stationW + 15);
      // 座位角：長凳在用、塑膠凳疊起來收著；旁邊一塊補過的牆
      put("bench", voidIndex * stationW - 34);
      put("stools", voidIndex * stationW - 64);
      put("wallpatch", voidIndex * stationW - 118);
      // 公告牆：現在貼的一張＋撕掉那張留下的痕
      put("notice", (voidIndex + 1) * stationW + 8);
      put("ghost", (voidIndex + 1) * stationW + 33);
      // 雨水管：右二站交界的牆面（附屬構件，不是裝飾）
      put("downspout", (voidIndex + 2) * stationW - 3);
      // 後勤角（右端牆尾）：配電箱＋電管線、水龍頭＋水桶、滅火器——有人在管
      const endX = (STATIONS.length - 1 + 0.88) * stationW;
      put("conduit", endX + 32);
      put("utilbox", endX + 25);
      put("tap", endX + 52);
      put("bucket", endX + 47);
      put("extinguisher", endX + 4);
      // 增建中的殿旁：一小堆砌石料（工班的真實，不是 disabled 標籤）
      const hyp = STATIONS.findIndex((s) => s.hypothetical);
      if (hyp >= 0) put("stones", (hyp + 0.86) * stationW);
      // 燈籠列：頭頂一條、小而疏；位置永遠落在半站點——中軸正上方必為空檔
      const vw2 = view.clientWidth || Math.min(430, innerWidth);
      const rope = document.createElement("div");
      rope.className = "lived lantern-rope";
      rope.style.left = (-vw2) + "px";
      rope.style.width = (STATIONS.length * stationW + vw2 * 2) + "px";
      stageStrip.appendChild(rope);
      for (let k = -2; k < STATIONS.length * 2 + 2; k++) {
        const el = document.createElement("div");
        el.className = "lived lantern";
        el.style.left = Math.round(k * (stationW / 2) + stationW / 4 - 5) + "px";
        el.style.top = `calc(5% + ${((k * 37) % 5 + 5) % 5}px)`; // 吊長不一，人掛的
        stageStrip.appendChild(el);
      }
    }

    groundJoints.innerHTML = "";
    const jointCount = Math.ceil((STATIONS.length * stationW + vw * 2) / 88);
    for (let i = 0; i < jointCount; i++) groundJoints.appendChild(document.createElement("i"));
    groundJoints.style.left = (-vw) + "px";

    nearStrip.innerHTML = "";
    // 柱位＝站與站的交界（stage 座標 (i+0.5)*stationW，相對站0中心）。
    // 螢幕位置 = vw/2 + (柱位 - scroll)*1.55；正對任一站時柱在畫框外。
    for (let i = 0; i < STATIONS.length - 1; i++) {
      const p = document.createElement("i");
      p.dataset.bx = (i + 0.5) * stationW;
      nearStrip.appendChild(p);
    }

    applyFrame();
  }

  function applyFrame() {
    // overflow:hidden 容器仍可能被瀏覽器 focus/click 自動捲動——每幀歸零
    if (view.scrollLeft) view.scrollLeft = 0;
    const app = document.getElementById("app");
    if (app.scrollLeft) app.scrollLeft = 0;
    const vw = view.clientWidth || Math.min(430, innerWidth);
    stageStrip.style.transform = `translateX(${pad0 - scroll}px)`;
    farStrip.style.transform = `translateX(${-scroll * 0.35}px)`;
    groundJoints.style.transform = `translateX(${(pad0 - scroll) * 0.9}px)`;
    for (const p of nearStrip.children) {
      const x = vw / 2 + (Number(p.dataset.bx) - scroll) * 1.55 - 17;
      p.style.transform = `translateX(${x}px)`;
    }
    // 近大遠小＝透視，不是位階：每一站被正對時的尺度完全相等
    STATIONS.forEach((s, i) => {
      const el = stageStrip.children[i];
      if (!el) return;
      const d = Math.min(1.4, Math.abs(stationCenter(i) - scroll) / stationW);
      const sc = 1 - 0.13 * Math.min(1, d);
      el.style.transform = `scale(${sc.toFixed(3)})`;
      el.style.opacity = (1 - 0.14 * Math.min(1, d)).toFixed(3);
    });
    const ni = nearestStation();
    const settledOnHall = !STATIONS[ni].void && !STATIONS[ni].hypothetical &&
      Math.abs(stationCenter(ni) - scroll) < stationW * 0.12;
    $("groundPath").style.opacity = settledOnHall ? "1" : "0";
    // 樹在視野中的位置餵給聲音層（幾何由這裡推播；聲音層不讀 mechanics）
    window.ARRIVAL_SOUND?.tree(treeSoundX + pad0 - scroll - vw / 2, vw);
  }

  function animate() {
    raf = 0;
    if (!dragging) {
      const diff = targetScroll - scroll;
      if (Math.abs(diff) > 0.4) {
        scroll += reduceMotion ? diff : diff * 0.11;
      } else {
        scroll = targetScroll;
      }
    }
    applyFrame();
    if (!dragging && scroll !== targetScroll) raf = requestAnimationFrame(animate);
    else updateFacingUI();
  }
  function kick() { if (!raf) raf = requestAnimationFrame(animate); }

  function courtAnimating() { // settle／turning 進行中（與 animate() 收斂門檻同源：0.4px）
    return !dragging && Math.abs(targetScroll - scroll) > 0.4;
  }

  function settleToNearest() {
    let i = nearestStation();
    // 慣性：依釋放速度多轉半站
    if (!reduceMotion && Math.abs(velocity) > 0.55) {
      i = Math.max(0, Math.min(STATIONS.length - 1, i + (velocity < 0 ? 1 : -1)));
    }
    targetScroll = stationCenter(i);
    kick();
  }

  view.addEventListener("pointerdown", (ev) => {
    if (courtAnimating()) { // 護欄：settle／turning 中的點觸只回一聲輕叩——
      window.ARRIVAL_SOUND?.nudge(); // 不 retarget、不改互動狀態、不 kick、不進殿
      return;
    }
    downTarget = ev.target;
    dragging = true;
    dragStartX = lastX = ev.clientX;
    dragStartScroll = scroll;
    lastT = performance.now();
    velocity = 0;
    view.setPointerCapture(ev.pointerId);
  });
  view.addEventListener("pointermove", (ev) => {
    if (!dragging) return;
    const now = performance.now();
    velocity = (ev.clientX - lastX) / Math.max(1, now - lastT);
    lastX = ev.clientX; lastT = now;
    scroll = Math.max(-stationW * 0.25, Math.min(stationCenter(STATIONS.length - 1) + stationW * 0.25,
      dragStartScroll - (ev.clientX - dragStartX)));
    if (!hasTurned && Math.abs(ev.clientX - dragStartX) > 30) {
      hasTurned = true;
      $("turnHint").style.opacity = "0";
    }
    applyFrame();
  });
  const release = (ev) => {
    if (!dragging) return;
    dragging = false;
    const moved = Math.abs(ev.clientX - dragStartX) > 8;
    settleToNearest();
    if (!moved) {
      if (downTarget?.closest("[data-chron]")) { openChron(); return; }
      const facade = downTarget?.closest("[data-hall]");
      if (facade) {
        const idx = STATIONS.findIndex((s) => s.id === facade.dataset.hall);
        const facedNow = Math.abs(stationCenter(idx) - scroll) < stationW * 0.3;
        if (facedNow) {
          enterHall(STATIONS[idx]);
        } else {
          targetScroll = stationCenter(idx); // 先轉身面對，靠近才進殿
          kick();
        }
      }
    }
  };
  view.addEventListener("pointerup", release);
  view.addEventListener("pointercancel", () => {
    if (!dragging) return; // 沒在拖＝沒有可取消的拖曳：不得把 cancel 變成重新定錨
    dragging = false;
    settleToNearest();
  });

  function updateFacingUI() {
    const s = STATIONS[nearestStation()];
    if (!s) return;
    if (s.void) {
      sessionFacing = "void";
    } else {
      sessionFacing = s.id;
    }
    updateWalkHint();
  }

  function faceStation(idOrVoid, { instant } = {}) {
    const i = idOrVoid === "void" ? voidIndex : STATIONS.findIndex((s) => s.id === idOrVoid);
    const idx = i >= 0 ? i : voidIndex;
    targetScroll = stationCenter(idx);
    if (instant) { scroll = targetScroll; applyFrame(); updateFacingUI(); }
    else kick();
  }

  function renderCourt() {
    buildCourt();
    const facing = sessionFacing;
    faceStation(facing, { instant: true });
    const book = store.get(BOOK_KEY, []);
    $("bookCount").textContent = book.length ? `${book.length} 籤` : "";
    updateWalkHint();
  }
  addEventListener("resize", () => { if ($("s-court").classList.contains("on")) renderCourt(); });

  function updateWalkHint() {
    const bound = POOL && window.DRAW_POLICY.peekBinding({ question: $("question").value });
    if (bound) {
      $("walkHint").innerHTML = "";
      const strip = document.createElement("div");
      strip.className = "bound-strip";
      strip.textContent = "這個問題已有一支籤——案上放著，點看。";
      strip.addEventListener("click", () => {
        if (courtAnimating()) { // 轉身中點「案上的籤」也只輕叩：不因此進殿
          window.ARRIVAL_SOUND?.nudge();
          return;
        }
        const entry = POOL.entries.find((e) => e.id === bound.entryId);
        const hall = HALLS.find((h) => h.corpusId === entry.corpus_id) ?? HALLS[0];
        enterHall(hall, { boundEntry: entry });
      });
      $("walkHint").appendChild(strip);
      return;
    }
    if (!POOL) {
      $("walkHint").textContent = "籤詩資料層未通過驗證，暫停抽籤（fail-closed）。";
      return;
    }
    const s = STATIONS[nearestStation()];
    if (!s || s.void) $("walkHint").textContent = "左右轉身，走向一殿。";
    else if (s.hypothetical) $("walkHint").textContent = "月老殿增建中——籤本仍在考證。";
    else $("walkHint").textContent = `正對　${s.deity}殿——點門內，進殿。`;
  }
  $("question").addEventListener("input", updateWalkHint);

  /* ---------- 走向殿（前進＝門洞放大） ---------- */
  function enterHall(hall, { boundEntry } = {}) {
    currentHall = hall;
    sessionFacing = hall.id ?? "void";
    // 聲音與 400ms 轉場同步收窄。月老 fail-closed 同構：增建中無殿內聲態，
    // 埕的空氣照常經過工地（guard 同 renderHall 的 fail-closed 謂詞，非身分分支）。
    if (!hall.hypothetical && hall.corpusId) window.ARRIVAL_SOUND?.space("hall");
    const court = $("s-court");
    court.style.transform = "scale(1.5)";
    court.style.opacity = "0";
    setTimeout(() => {
      court.style.transform = ""; court.style.opacity = "";
      renderHall(hall, { boundEntry });
      show("hall");
    }, reduceMotion ? 0 : 400);
  }

  $("backBtn").addEventListener("click", () => {
    window.ARRIVAL_SOUND?.space("court"); // 回埕：空氣展開還原
    renderCourt();
    show("court");
  });

  function openChron() {
    const list = $("chronList");
    list.innerHTML = "";
    for (const g of chronDates()) {
      const dEl = document.createElement("p");
      dEl.className = "d";
      dEl.textContent = g.d;
      list.appendChild(dEl);
      for (const it of g.items) {
        const p = document.createElement("p");
        p.textContent = it;
        list.appendChild(p);
      }
    }
    $("chronOverlay").classList.add("on");
  }

  /* ---------- 殿 ---------- */
  function renderHall(hall, { boundEntry } = {}) {
    $("tablet").textContent = hall.deity;
    // 匾同規格，字隨匾：聖號字數多則字級收斂，匾高（＝儀式的位置）不因誰而沉。
    // 依字數不依身分（typography, not identity）——四字匾曾把籤筒推出手機畫面。
    $("tablet").style.fontSize = hall.deity.length > 3
      ? `calc(var(--tablet-fs) * ${(3 / hall.deity.length).toFixed(3)})` : "";
    $("hallSub").textContent = hall.sub;
    $("tubeStage").style.display = "none";
    $("stickStage").style.display = "none";
    $("slipStage").style.display = "none";
    $("unbuilt").hidden = true;
    $("hallDesk").style.display = "";
    // 香爐是使用痕跡：未落成的殿還沒有人來拜（presentation only）
    $("censer").style.display = (hall.hypothetical || !hall.corpusId) ? "none" : "";

    const q = window.DRAW_POLICY.normalizeQuestion($("question").value);
    $("presentQ").textContent = q || "（未寫問題——空手而來也可以）";
    $("presentQ").classList.toggle("empty", !q);

    if (hall.hypothetical || !hall.corpusId) {
      // 未落成之殿：誠實 fail-closed，不可抽
      $("hallDesk").style.display = "none";
      $("unbuilt").hidden = false;
      $("unbuilt").textContent = "本殿尚未落成——籤本仍在來源考證中。考證完成、通過治理之日，沿革記上會有這一殿。";
      return;
    }

    if (!POOL) {
      $("unbuilt").hidden = false;
      $("unbuilt").textContent = "籤詩資料層未通過驗證，暫停抽籤（fail-closed）。";
      return;
    }

    // 一事一籤：已綁定 → 案上直接是那張紙
    const bound = boundEntry ?? (() => {
      const b = window.DRAW_POLICY.peekBinding({ question: $("question").value });
      return b ? POOL.entries.find((e) => e.id === b.entryId) : null;
    })();
    if (bound) {
      showSlip(bound, { repeated: !boundEntry });
      return;
    }

    $("tubeStage").style.display = "flex";
    resetStick();
    // 進殿先見聖號一息，隨後步向案前——進殿本來就是往裡走，鏡頭跟著身體。
    // 手機上籤筒常在摺線下，而半露的筒會攔截捲頁手勢（touch-action:none）：
    // 把儀式完整框進畫面，碰筒＝就是要抽，捲頁的需求就消失了。
    setTimeout(() => {
      if ($("tubeStage").style.display !== "none" && $("s-hall").classList.contains("on"))
        $("tubeStage").scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "end" });
    }, reduceMotion ? 0 : 650);
  }

  /* ---------- 拖抽 ---------- */
  const PULL_DIST = 130;
  let pulling = false, startY = 0, ticked = false;
  const stickEl = $("tubeStick");
  const REST = 140, TOP = -34;
  function setStick(p) { stickEl.style.transform = `translateX(-50%) translateY(${REST + (TOP - REST) * p}px)`; }
  function resetStick() { stickEl.style.transition = "none"; setStick(0); }
  $("tubeWrap").addEventListener("pointerdown", (ev) => {
    if (!POOL || pulling) return;
    ev.preventDefault();
    pulling = true; ticked = false; startY = ev.clientY;
    stickEl.style.transition = "none";
  });
  window.addEventListener("pointermove", (ev) => {
    if (!pulling) return;
    const raw = Math.max(0, startY - ev.clientY) / PULL_DIST;
    const p = Math.min(1, raw < 0.8 ? raw : 0.8 + (raw - 0.8) * 0.75);
    setStick(p);
    window.ARRIVAL_SOUND?.pull(p); // 手感層：筒內竹籤跟著手（只推 gesture 進度）
    if (!ticked && p > 0.5) { ticked = true; if (navigator.vibrate) navigator.vibrate(6); }
    if (p >= 1) { pulling = false; completeDraw(); }
  });
  const endPull = () => {
    if (!pulling) return;
    pulling = false;
    stickEl.style.transition = "transform 240ms ease"; setStick(0);
  };
  window.addEventListener("pointerup", endPull);
  window.addEventListener("pointercancel", endPull);
  if (DEVDRAW) $("tubeWrap").addEventListener("click", () => { if (!pulling) completeDraw(); });

  function uniformDraw(corpusId) {
    const c = POOL.entries.filter((e) => e.corpus_id === corpusId);
    return c[Math.floor(Math.random() * c.length)];
  }

  function completeDraw() {
    if (navigator.vibrate) navigator.vibrate(16);
    window.ARRIVAL_SOUND?.stickOut(); // 籤枝離筒（devdraw 同路）
    currentResolved = window.DRAW_POLICY.resolveDraw({
      question: $("question").value,
      corpusId: currentHall.corpusId,
      drawFn: uniformDraw,
    });
    const entry = POOL.entries.find((e) => e.id === currentResolved.entryId);
    $("tubeStage").style.display = "none";
    $("stickLabel").textContent = window.SLIP_RENDER.tabText(entry);
    $("stickStage").style.display = "flex";
    // 你抽動了世界，世界把籤端到你面前——手機上換幕的新主角常在摺線下
    $("stickStage").scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "center" });
  }

  $("takeBtn").addEventListener("click", () => {
    window.ARRIVAL_SOUND?.paperOut(); // 取籤詩的紙聲——僅此一處：籤簿重看不再取紙
    const entry = POOL.entries.find((e) => e.id === currentResolved.entryId);
    showSlip(entry, { repeated: false });
  });

  function showSlip(entry, { repeated }) {
    window.ARRIVAL_SOUND?.slip(true); // 紙是主角：世界閉嘴
    $("tubeStage").style.display = "none";
    $("stickStage").style.display = "none";
    $("slipStage").style.display = "flex";
    $("slipStage").scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" }); // 紙登場＝紙在眼前
    const mount = $("slipMount");
    mount.innerHTML = "";
    try {
      window.SLIP_RENDER.mountSlip(mount, entry);
    } catch (err) {
      const p = document.createElement("p");
      p.style.color = "var(--cinnabar)"; p.style.fontSize = "13px"; p.style.lineHeight = "1.8";
      p.textContent = "此籤未通過 provenance 對應檢查，拒絕排版（fail-closed）：" + err.message;
      mount.appendChild(p);
      return;
    }
    const q = window.DRAW_POLICY.normalizeQuestion($("question").value);
    const book = store.get(BOOK_KEY, []);
    const existing = book.find((b) => b.entryId === entry.id && b.question === q);
    $("noteInput").value = existing?.note ?? "";
    // 帶走＝籤簿中每張紙的能力：已收的籤才帶得走（在籤簿裡 ⟺ 是你的了）
    $("takeawayZone").hidden = !existing;
    currentTakeawayTs = existing?.ts ?? null;
    currentResolved = { entryId: entry.id, repeated };
  }

  $("keepBtn").addEventListener("click", () => {
    const stage = $("slipStage");
    if (stage.classList.contains("slip-away")) return; // 收一次就是一次
    const entry = POOL.entries.find((e) => e.id === currentResolved.entryId);
    const q = window.DRAW_POLICY.normalizeQuestion($("question").value);
    const note = $("noteInput").value.trim();
    const book = store.get(BOOK_KEY, []);
    const existing = book.find((b) => b.entryId === entry.id && b.question === q);
    if (existing) existing.note = note;
    else book.unshift({ ts: new Date().toISOString(), question: q, entryId: entry.id, corpusId: entry.corpus_id, note });
    store.set(BOOK_KEY, book);
    const d = new Date();
    store.set(LASTHALL_KEY, { id: currentHall.id, date: `${cnNum(d.getMonth() + 1)}月${cnNum(d.getDate())}日` });
    // 問題留在案上（recovery, 2026-08-30）：收籤＝句點，但問過的事不必被抹掉。
    // 清空會讓下一輪變成「非本人意圖的空手」，在簿裡留下 question:"" 的幽靈條目。
    // 同題再抽由一事一籤直接回看同一支；要新的一支就寫新問題；真想空手，自己清空即是。
    // 收籤＝句點：紙收起、一拍靜，然後世界回來。無旁白——沒有人留你。
    stage.classList.add("slip-away");
    setTimeout(() => {
      stage.classList.remove("slip-away");
      window.ARRIVAL_SOUND?.space("court"); // 回埕：空氣展開＝句點的迴響
      renderCourt();
      show("court");
    }, reduceMotion ? 0 : 950);
  });

  /* ---------- 帶走這支籤（share artifact＝The Slip 本體，frozen 元件原樣 render） ----------
     不分享：使用者問題、私人筆記、visit 紀錄、任何 growth 文案。
     圖上只有：紙＋抽籤那天的日期・節氣。「複製連結」等 deploy 後才有連結可複製。 */
  let currentTakeawayTs = null;

  // 不讀 stylesheet（file:// 讀不到、http 才讀得到＝兩條路）：對量測 DOM 逐元素
  // 抄 live computed style、把 ::before/::after 實體化——一條路，而且所見即所得。
  function deepInline(src, dst) {
    const srcKids = [...src.children], dstKids = [...dst.children];
    for (let i = 0; i < srcKids.length; i++) deepInline(srcKids[i], dstKids[i]);
    // computed style 會把 url(#slip-rough) 絕對化成頁面網址——SVG 內出現
    // 外部引用會 taint canvas；把 base 剝掉，讓引用留在 SVG 文件內。
    const deBase = (s) => s.split(location.href).join("");
    const cs = getComputedStyle(src);
    let t = "";
    for (const prop of cs) t += prop + ":" + cs.getPropertyValue(prop) + ";";
    dst.setAttribute("style", deBase(t) + "animation:none;transition:none;");
    for (const pseudo of ["::before", "::after"]) {
      const ps = getComputedStyle(src, pseudo);
      if (!ps || ps.content === "none" || ps.content === "normal") continue;
      let pt = "";
      for (const prop of ps) pt += prop + ":" + ps.getPropertyValue(prop) + ";";
      const el = document.createElement("span");
      el.setAttribute("style", deBase(pt) + "animation:none;transition:none;");
      if (pseudo === "::before") dst.insertBefore(el, dst.firstChild);
      else dst.appendChild(el);
    }
  }
  async function inlineFontCss(text) {
    // SVG <img> 不允許外部資源：只抓這張紙用到的字（css2 text= 子集），base64 內嵌
    const uniq = [...new Set(text.replace(/\s/g, ""))].join("");
    const cssUrl = "https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400..700&text=" + encodeURIComponent(uniq);
    let css = await (await fetch(cssUrl)).text();
    for (const [, u] of [...css.matchAll(/url\((https:[^)]+)\)/g)]) {
      const bytes = new Uint8Array(await (await fetch(u)).arrayBuffer());
      let bin = "";
      for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
      css = css.replace(u, "data:font/woff2;base64," + btoa(bin));
    }
    return css;
  }
  async function renderTakeawayPng(entry, ts) {
    // 先隱形掛一份實紙量尺寸（量測與 SVG 用同一份 CSS＝所見即所得）
    const meas = document.createElement("div");
    meas.style.cssText = "position:absolute;left:-9999px;top:0;";
    document.body.appendChild(meas);
    const art = document.createElement("div");
    art.className = "takeaway-art";
    meas.appendChild(art);
    window.SLIP_RENDER.mountSlip(art, entry);
    // 量測副本先殺動畫：否則 computed style 抄到 slip-settle 第 0 幀（opacity 0）
    for (const el of [art, ...art.querySelectorAll("*")]) el.style.animation = "none";
    const d = ts ? new Date(ts) : new Date();
    const dl = document.createElement("div");
    dl.className = "takeaway-date";
    dl.textContent = `${cnNum(d.getMonth() + 1)}月${cnNum(d.getDate())}日・${currentTerm(d)}`;
    art.appendChild(dl);
    const w = art.offsetWidth, h = art.offsetHeight;
    const artText = art.textContent;
    const clone = art.cloneNode(true);
    deepInline(art, clone); // 量測 DOM 還掛著＝computed style 是活的
    meas.remove();
    const artXml = new XMLSerializer().serializeToString(clone);
    const filterDef = new XMLSerializer().serializeToString(document.getElementById("slip-rough"));
    const css = await inlineFontCss(artText); // SVG 內只需要字型——其他樣式全在元素上
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><defs>${filterDef}</defs>` +
      `<foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml">` +
      `<style><![CDATA[${css}]]></style>${artXml}</div></foreignObject></svg>`;
    // data URI 而非 blob URL：blob＋foreignObject 在 file:// 下會 taint canvas
    const img = await new Promise((res, rej) => {
      const i = new Image();
      i.onload = () => res(i);
      i.onerror = () => rej(new Error("svg render failed"));
      i.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
    });
    const canvas = document.createElement("canvas");
    canvas.width = w * 2; canvas.height = h * 2; // 2x：紙要經得起看
    const c2d = canvas.getContext("2d");
    // WebKit/iOS：SVG 影像文件裡的 @font-face 是非同步的——第一繪是隱形字
    // （無限 FOIT）。重繪到畫面穩定為止；Chrome 第一繪即穩，多繪無害。
    const sample = () => {
      const s = c2d.getImageData(0, Math.floor(h * 1.2), w * 2, 4).data; // 掃詩文區一條
      let sum = 0;
      for (let i = 0; i < s.length; i += 16) sum += s[i];
      return sum;
    };
    let last = null, changed = false;
    for (let i = 0; i < 10; i++) {
      c2d.setTransform(2, 0, 0, 2, 0, 0);
      c2d.clearRect(0, 0, w, h);
      c2d.drawImage(img, 0, 0);
      const sig = sample();
      if (last !== null && sig === last && (changed || i >= 2)) break;
      if (last !== null && sig !== last) changed = true;
      last = sig;
      await new Promise((r) => setTimeout(r, 250));
    }
    return await new Promise((res, rej) => canvas.toBlob((b) => (b ? res(b) : rej(new Error("png encode failed"))), "image/png"));
  }
  $("takeawayBtn").addEventListener("click", async () => {
    const btn = $("takeawayBtn");
    const orig = "帶走這支籤";
    btn.disabled = true;
    btn.textContent = "備紙中";
    try {
      const entry = POOL.entries.find((e) => e.id === currentResolved.entryId);
      const blob = await renderTakeawayPng(entry, currentTakeawayTs);
      const file = new File([blob], "draw-one-slip.png", { type: "image/png" });
      if (navigator.canShare?.({ files: [file] })) {
        await navigator.share({ files: [file] }); // 不帶任何文案——紙自己說話
      } else {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "draw-one-slip.png";
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      }
      btn.textContent = orig;
    } catch (err) {
      if (err?.name === "AbortError") btn.textContent = orig; // 使用者收手不是錯
      else {
        console.warn("takeaway render failed:", err); // warn 不是 error：留診斷、不髒 console
        btn.textContent = "產圖失敗——可先複製籤文";
        setTimeout(() => { btn.textContent = orig; }, 2600);
      }
    }
    btn.disabled = false;
  });
  $("copyBtn").addEventListener("click", async () => {
    const entry = POOL.entries.find((e) => e.id === currentResolved.entryId);
    const reg = window.SLIP_RENDER.COLOPHON_REGISTRY[entry.corpus_id];
    const status = window.SLIP_RENDER.STATUS_WORD[entry.provenance.transcription_status];
    const d = currentTakeawayTs ? new Date(currentTakeawayTs) : new Date();
    const text = [
      reg.title_short + "　" + window.SLIP_RENDER.tabText(entry),
      entry.historical_text.poem_text,
      reg.source_line + "　抽一謹錄　" + status,
      `${cnNum(d.getMonth() + 1)}月${cnNum(d.getDate())}日・${currentTerm(d)}`,
    ].join("\n");
    try {
      await navigator.clipboard.writeText(text);
      $("copyBtn").textContent = "已複製";
    } catch {
      $("copyBtn").textContent = "複製失敗";
    }
    setTimeout(() => { $("copyBtn").textContent = "複製籤文"; }, 1800);
  });

  /* ---------- 沿革 / 籤簿 overlays ---------- */
  function chronDates() {
    // 落成日＝籤本通過 production gate 之日（同期落成，沿革如實記載）
    return [
      { d: "二〇二六年八月十八日・同期落成", items: HALLS.filter((h) => !h.hypothetical).map((h) => h.chron) },
      ...(HALLS.some((h) => h.hypothetical) ? [{ d: "（假設情境）", items: [HYPOTHETICAL_4TH.chron] }] : []),
    ];
  }
  $("bookObj").addEventListener("click", () => {
    const book = store.get(BOOK_KEY, []);
    $("bookEmpty").hidden = book.length > 0;
    const list = $("bookList");
    list.innerHTML = "";
    book.forEach((b, i) => {
      const entry = POOL?.entries.find((e) => e.id === b.entryId);
      if (!entry) return;
      const d = new Date(b.ts);
      const btn = document.createElement("button");
      btn.className = "book-entry";
      const l1 = document.createElement("span"); l1.className = "book-line1";
      const t = document.createElement("span"); t.className = "book-tab";
      t.textContent = window.SLIP_RENDER.tabText(entry);
      const dt = document.createElement("span"); dt.className = "book-date";
      dt.textContent = `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, "0")}.${String(d.getDate()).padStart(2, "0")}`;
      l1.append(t, dt);
      const ql = document.createElement("span"); ql.className = "book-q";
      ql.textContent = b.question || "（未寫問題）";
      btn.append(l1, ql);
      btn.addEventListener("click", () => {
        $("bookOverlay").classList.remove("on");
        const hall = HALLS.find((h) => h.corpusId === entry.corpus_id) ?? HALLS[0];
        currentHall = hall;
        $("question").value = b.question;
        renderHall(hall, { boundEntry: entry });
        show("hall");
      });
      list.appendChild(btn);
    });
    $("bookOverlay").classList.add("on");
  });

  for (const id of ["chronOverlay", "bookOverlay"]) {
    $(id).addEventListener("click", (ev) => { if (ev.target === $(id)) $(id).classList.remove("on"); });
  }

  /* ---------- 天氣票（D 拍板：一天一張）＋聲音層掛點 ---------- */
  // 票＝今天的：今天第一次來在門檻上拿，當日沿用，跨日作廢明天重拿。
  // 記在 localStorage（記憶私人）——票是環境不是朝向，boot neutrality 不受影響。
  // ?weather= 降級為純試聽 override：不寫票、不動門檻。不答＝常日。
  const TICKET_KEY = "arrival.ticket.v1";
  const AUDITION_WEATHER = new URLSearchParams(location.search).get("weather");
  // dev 後門僅此兩個：?weather=（試聽，不寫票）、?newday=1（撕掉今天的票，重過門檻）
  // 保留、不做 production guard——對 user 隱形，對 maintainer 顯眼：docs/testing/qa-cheatsheet.md
  if (new URLSearchParams(location.search).get("newday") === "1") {
    try { localStorage.removeItem(TICKET_KEY); } catch {}
  }
  // 票面合法值僅此四——合法性判斷集中一處（own-property，防 prototype chain 穿透）
  const WEATHER_CHARS = { sunny: "晴", cloudy: "陰", rain: "雨", wind: "風" };
  const isValidWeather = (name) => typeof name === "string" && Object.hasOwn(WEATHER_CHARS, name);
  const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };
  const todaysTicket = () => { const t = store.get(TICKET_KEY, null); return t && t.date === todayStr() ? t : null; };
  let gateWeather = null; // 門檻上選的票（null＝不拿＝常日）
  window.ARRIVAL_SOUND?.weather(AUDITION_WEATHER ?? todaysTicket()?.weather);

  for (const b of document.querySelectorAll(".gw-opt")) {
    b.addEventListener("click", () => {
      gateWeather = gateWeather === b.dataset.w ? null : b.dataset.w; // 再點一次＝放回
      for (const o of document.querySelectorAll(".gw-opt")) o.classList.toggle("on", o.dataset.w === gateWeather);
      $("gateWeather").classList.toggle("chosen", !!gateWeather);
    });
  }
  // AudioContext 必須在手勢後啟動：初訪＝山門「入內」；回訪＝首次觸碰埕。
  // 山門期間不啟動——門檻之外無聲（提案狀態，未拍板）。
  document.addEventListener("pointerdown", () => {
    if (!$("s-gate").classList.contains("on")) window.ARRIVAL_SOUND?.start();
  }, { passive: true });
  function syncSoundUI() {
    const on = !!window.ARRIVAL_SOUND?.enabled();
    for (const el of document.querySelectorAll(".sound-toggle")) {
      el.classList.toggle("off", !on);
      el.setAttribute("aria-pressed", String(on));
      el.title = on ? "聲・開（點一下轉靜）" : "聲・靜（點一下打開）";
    }
  }
  for (const el of document.querySelectorAll(".sound-toggle")) {
    el.addEventListener("click", () => {
      window.ARRIVAL_SOUND?.setEnabled(!window.ARRIVAL_SOUND?.enabled());
      syncSoundUI();
    });
  }
  syncSoundUI();

  /* ---------- boot：初訪走山門（規矩＋天氣）；「今天第一次來」過薄門檻拿票；
     當日已有票＝直落埕（boot 落埕的修訂僅此一條，D 拍板） ---------- */
  $("enterBtn").addEventListener("click", () => {
    if (!AUDITION_WEATHER) { // 試聽 override 不寫票
      store.set(TICKET_KEY, { date: todayStr(), weather: gateWeather }); // 不答存 null＝常日
      window.ARRIVAL_SOUND?.weather(gateWeather);
    }
    window.ARRIVAL_SOUND?.start(); // 入內＝門檻上的手勢：空氣自此有聲
    store.set(VISITED_KEY, true);
    renderCourt();
    show("court");
  });

  if (store.get(VISITED_KEY, false) && (AUDITION_WEATHER || todaysTicket())) {
    renderCourt();
    show("court");
  } else {
    const d = new Date();
    $("gateDate").textContent = `${cnNum(d.getMonth() + 1)}月${cnNum(d.getDate())}日・${currentTerm(d)}`;
    $("gateRules").style.display = store.get(VISITED_KEY, false) ? "none" : "grid"; // 回訪＝薄門檻
    show("gate");
  }
})();
</script>
