<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>抽一 · 一起校對籤本</title><style>body{max-width:720px;margin:auto;padding:32px 20px;background:#faf7f0;color:#302b26;font:18px/1.7 system-ui}a{color:#73502c;overflow-wrap:anywhere}nav a{display:block;border:1px solid #c7bba8;margin:16px 0;padding:20px;text-decoration:none}a:focus-visible{outline:3px solid #995c24;outline-offset:4px}h1{font-size:1.7em}/* 前台潤飾（飛寶 2026-11-15）：只加樣式，不動結構與資料。紙色、宋體標題、籤文直讀感；控制項與欄位收合照舊。 */:root{--paper:#f4efe4;--ground:#e9e4d8;--ink:#2e2a24;--soft:#6b6257;--rule:#c9bda9;--seal:#8c3b2a}body{background:var(--ground);color:var(--ink);font:17px/1.8 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif}h1,h2,h3,h4,.verse,nav a{font-family:'Noto Serif TC','Songti TC','PMingLiU',serif}h1{font-size:1.6em;letter-spacing:.14em;margin:.5em 0 .2em;font-weight:600}header>a,body>a:first-child{display:inline-block;margin:0 18px 6px 0;font-size:.85em;letter-spacing:.1em;color:var(--soft);text-decoration:none;border-bottom:1px solid var(--rule)}header>a:hover,body>a:first-child:hover{color:var(--ink)}a{color:#6d4a26}#filters{background:var(--paper);border:1px solid var(--rule);border-top:3px solid var(--ink);padding:14px 16px;margin:18px 0 12px}#filters label{font-size:.85em;letter-spacing:.08em;color:var(--soft)}input[type=search],select{background:#fffdf8;border:1px solid var(--rule);padding:8px 10px;border-radius:0;color:var(--ink);min-width:0}input[type=search]{width:min(100%,22em)}button{background:var(--paper);border:1px solid var(--ink);padding:7px 16px;letter-spacing:.2em;color:var(--ink);cursor:pointer;border-radius:0;margin:4px 6px 4px 0}button[type=submit]{background:var(--ink);color:var(--paper)}input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--seal);outline-offset:2px}#count{font-size:.85em;color:var(--soft);margin:.4em 0 0}fieldset{border:1px dotted var(--rule);padding:8px 14px;margin:0 0 6px;font-size:.9em}legend{color:var(--soft);font-size:.9em;letter-spacing:.06em;padding:0 6px}.table-header{position:sticky;top:0;background:var(--ground);z-index:2;font-family:'Noto Serif TC','Songti TC',serif;letter-spacing:.2em;font-size:.9em;border-bottom:2px solid var(--ink)}.slip-group{border-top:1px solid var(--rule)}.lot-label h2{font-size:.85em;letter-spacing:.02em;border-top:3px solid var(--ink);padding:5px 0 0;margin:0;white-space:nowrap;font-weight:600}.comparison h3{font-size:.8em;letter-spacing:.2em;color:var(--soft);font-weight:500;margin:0 0 6px}@media(min-width:1101px){.comparison h3{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}}.verse{font-size:1.12em;line-height:2;letter-spacing:.06em;margin:.2em 0 .5em}article{border-top:1px dotted var(--rule);padding:14px 0}article:first-of-type{border-top:0;padding-top:0}article h2{font-size:.95em;letter-spacing:.2em;margin:0 0 4px}.status{display:inline-block;font-size:.78em;letter-spacing:.08em;color:var(--seal);border:1px solid currentColor;padding:0 7px;margin:0 0 6px}.source,small{font-size:.8em;color:var(--soft)}details{font-size:.9em}summary{color:var(--soft);letter-spacing:.04em}details[open] summary{color:var(--ink)}@media(max-width:1100px){.slip-group{background:var(--paper);border:1px solid var(--rule);border-top:3px solid var(--ink)}.comparison{gap:14px}}nav a{background:var(--paper);border:1px solid var(--rule);border-top:3px solid var(--ink);font-size:1.15em;letter-spacing:.16em;color:var(--ink)}nav a:hover{border-color:var(--ink)}#participate{border-top:1px solid var(--rule);margin-top:28px;padding-top:8px}#participate h2{font-size:1.1em;letter-spacing:.14em}@media(max-width:480px){body{padding:18px 14px;font-size:16px}}</style></head><body><a href="arrival.html">回到抽一</a><h1>徵求校對助手</h1><p>已做第一輪整理，邀請您一起複核。請選擇一組籤，對照來源與校對註記。</p><p class="source">校對的原則：古字照舊，不換成現代用字；讀不出的字留空，不替它補；每一筆都留著來源與目前的核對狀態。</p><nav aria-label="選擇籤組"><a href="corpus-review-guanyin.html">觀音 · 100 籤</a><a href="corpus-review-guandi.html">關帝 · 100 籤</a><a href="corpus-review-liushijiazi.html">六十甲子 · 60 籤</a></nav><section id="participate"><h2>一起參與</h2><p>在專案的 Issues 提出建議，請寫明殿名、籤號、欄位、疑字、建議讀法及來源頁碼。需自行登入 GitHub 並送出；這裡不會自動提交或儲存。公開留言請勿附私人資料或權利未明的整段現代解說。</p><a href="https://github.com/Crystal32378/draw-one" target="_blank" rel="noopener noreferrer">到 GitHub 專案參與校對 ↗</a></section></body></html>
