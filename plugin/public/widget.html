<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Draw One</title>
<style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#f5f0e6;color:#34312a;font-family:Georgia,'Songti TC',serif}main{max-width:560px;margin:auto}small{letter-spacing:.12em;color:#756b5b}h1{font-size:32px;font-weight:400}p{line-height:1.8}label{display:block;margin-top:18px}select,textarea,button{width:100%;font:inherit;padding:12px;border:1px solid #c6bbab;border-radius:4px;background:#faf7f0;color:inherit}textarea{min-height:90px;margin-top:8px}button{margin-top:14px;background:#3e473f;color:#fff;cursor:pointer}button:disabled{opacity:.55}article{margin-top:28px;border-top:1px solid #c6bbab;padding-top:20px}#poem{white-space:pre-wrap;font-size:22px;line-height:2;overflow-wrap:anywhere}#source{font-size:13px;overflow-wrap:anywhere}#notice{font-size:13px}#error{color:#9c3434}article[hidden]{display:none}</style>
<main><small>DRAW ONE · 一事一籤</small><h1>你最近，有沒有一件想問的事？</h1><p>留一點空白，抽一支籤。</p><form id="form"><label for="corpus">選擇籤系</label><select id="corpus"><option value="guanyin">觀音 · 百首籤</option><option value="guandi">關帝 · 百首籤</option><option value="liushijiazi">媽祖 · 六十甲子籤</option></select><label for="question">你想問的事（可以留白）</label><textarea id="question" maxlength="2000" placeholder="寫給自己看就好。"></textarea><p id="notice">問題只留在這個瀏覽器。同一件事保留第一次抽到的籤，換籤系也不重抽。清除儲存資料後，紀錄會消失。</p><button id="draw" disabled>正在連接…</button></form><p id="error" role="status"></p><article id="result" hidden aria-live="polite"><small id="identity"></small><p id="poem"></p><p id="source"></p><p id="repeat"></p><p>籤詩是一份文化文本。把它留在這裡，決定仍在你手中。</p></article></main>
<script>/* DRAW_POLICY */</script>
<script type="module">
const $=id=>document.getElementById(id);let seq=0,busy=false;const pending=new Map();
const notify=(method,params)=>parent.postMessage({jsonrpc:'2.0',method,params},'*');
const rpc=(method,params)=>new Promise((resolve,reject)=>{const id=++seq;const timer=setTimeout(()=>{pending.delete(id);reject(Error('連線逾時，請稍後再試。'));},20000);pending.set(id,{resolve,reject,timer});parent.postMessage({jsonrpc:'2.0',id,method,params},'*');});
window.addEventListener('message',event=>{if(event.source!==parent||event.data?.jsonrpc!=='2.0')return;const m=event.data,p=pending.get(m.id);if(p){clearTimeout(p.timer);pending.delete(m.id);m.error?p.reject(Error('連線失敗，請稍後再試。')):p.resolve(m.result);} /* Tool notifications intentionally do not bypass local question binding. */ });
const tool=async(name,args)=>{const r=await rpc('tools/call',{name,arguments:args});if(r.isError||!r.structuredContent)throw Error('暫時無法取得籤詩，請稍後再試。');return r.structuredContent;};
function render(entry,repeated){$('identity').textContent=({guanyin:'觀音',guandi:'關帝',liushijiazi:'媽祖 · 六十甲子'}[entry.corpus_id])+' · '+entry.original_slip_label;$('poem').textContent=entry.historical_text.poem_text;$('source').textContent=entry.provenance.edition_title+'\n文字核對狀態：'+({VERIFIED:'已對勘',PROBABLE:'待複核'}[entry.provenance.transcription_status]);$('repeat').textContent=repeated?'這件事已有一支籤，這裡保留第一次的結果。':'';$('result').hidden=false;}
try{localStorage.setItem('drawone.storage-check','1');localStorage.removeItem('drawone.storage-check');}catch{$('notice').textContent+=' 目前瀏覽器無法保存資料，僅能在這次開啟中保留同一支籤。';}
try{await rpc('ui/initialize',{appInfo:{name:'draw-one',version:'0.1.0'},appCapabilities:{},protocolVersion:'2026-01-26'});notify('ui/notifications/initialized',{});$('draw').disabled=false;$('draw').textContent='抽一支';}catch(e){$('error').textContent=e.message;$('draw').textContent='連接未完成';}
$('form').addEventListener('submit',async e=>{e.preventDefault();if(busy)return;busy=true;$('draw').disabled=true;$('error').textContent='';try{const question=$('question').value,corpusId=$('corpus').value;const existing=window.DRAW_POLICY.peekBinding({question});let entry,repeated;if(existing){({entry}=await tool('get_draw_one_slip',{entry_id:existing.entryId}));repeated=true;}else{const fresh=await tool('draw_one_slip',{corpus_id:corpusId});const binding=window.DRAW_POLICY.resolveDraw({question,corpusId,drawFn:()=>fresh.entry});repeated=binding.repeated;entry=binding.entryId===fresh.entry.id?fresh.entry:(await tool('get_draw_one_slip',{entry_id:binding.entryId})).entry;}render(entry,repeated);}catch(e){$('error').textContent=e.message;}finally{busy=false;$('draw').disabled=false;}});
</script></html>
