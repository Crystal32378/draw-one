<!doctype html>
<html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中秋回覆｜Draw One 本機管理</title><link rel="icon" href="/assets/favicon.svg"><link rel="stylesheet" href="/fonts.css"><link rel="stylesheet" href="/admin.css"><script src="/admin.js" type="module"></script></head>
<body><header><span class="brand">Draw One</span><span class="local-label">本機回覆管理</span></header><main><div class="opening"><div><h1>中秋回覆</h1><p>閱讀這台電腦收到的問卷。</p></div><div class="actions"><button type="button" id="refresh">重新讀取</button><a href="/export.csv" download>匯出 CSV</a></div></div><p id="status" role="status">正在讀取…</p><p id="error" role="alert" hidden></p><section id="summary" hidden aria-label="問卷統計"><p class="total"><strong id="total">0</strong> 份回覆</p><div class="summaries"><section><h2>還想再使用嗎？</h2><dl id="q1-results"></dl></section><section><h2>最想留下的部分</h2><dl id="q2-results"></dl></section></div></section><p id="empty" hidden>還沒有回覆。有人在中秋頁面送出後，按「重新讀取」就能看到。</p><section id="responses-section" hidden aria-labelledby="responses-title"><h2 id="responses-title">每一份回答</h2><ol id="responses"></ol></section></main><footer>資料只從本機讀取。這個管理頁與匯出端點不在公開的中秋頁面伺服器上。</footer></body></html>
